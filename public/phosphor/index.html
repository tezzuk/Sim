<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#020503" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='1' y='13' font-size='13' fill='%2333ff99'>∿</text></svg>" />
<title>PHOSPHOR</title>
<style>
  :root {
    --bg: #020503;
    --fg: #c8ffe0;
    --dim: #2e5c44;
    --phos: #33ff99;
    --ref: #ffb347;
    --hot: #ff5c5c;
    --panel: #04120b;
    --line: #0d2a1c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }

  #rig { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #scopewrap { position: relative; flex: 1; min-height: 0; }
  #scope { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scopewrap.jolt { animation: jolt .12s linear; }
  @keyframes jolt {
    25% { transform: translate(3px, -2px); }
    50% { transform: translate(-3px, 2px); }
    75% { transform: translate(2px, 2px); }
  }

  /* DSO chrome (HTML overlay, pointer-events none) */
  .chrome { position: absolute; font-size: 11px; letter-spacing: .18em; color: var(--dim); pointer-events: none; }
  #c-tl { top: max(10px, env(safe-area-inset-top)); left: 14px; }
  #c-tr { top: max(10px, env(safe-area-inset-top)); right: 14px; text-align: right; }
  #c-bl { bottom: 8px; left: 14px; }
  #c-br { bottom: 8px; right: 14px; text-align: right; }
  #c-tl b, #c-tr b { color: var(--phos); font-weight: 500; }
  #trig.lost { color: var(--hot); animation: blink 1s steps(2) infinite; }
  #trig.lock { color: var(--phos); }
  @keyframes blink { 50% { opacity: .2; } }

  #joules {
    position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%);
    text-align: center; pointer-events: none;
  }
  #jnum { font-size: clamp(20px, 4.5vw, 30px); font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(51, 255, 153, .25); }
  #jnum.bump { animation: bump .12s ease-out; }
  @keyframes bump { 0% { transform: scale(1.06); } 100% { transform: scale(1); } }
  #jsub { font-size: 10px; letter-spacing: .3em; color: var(--dim); margin-top: 2px; }
  #combo { font-size: 11px; letter-spacing: .2em; color: var(--phos); opacity: 0; transition: opacity .2s; margin-top: 3px; }

  #integ { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #07140d; z-index: 5; }
  #integfill { height: 100%; width: 100%; background: var(--phos); transition: width .15s linear; box-shadow: 0 0 10px rgba(51,255,153,.6); }
  #integ.low #integfill { background: var(--hot); box-shadow: 0 0 10px rgba(255,92,92,.7); animation: blink 0.6s steps(2) infinite; }

  #stageword {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
    font-size: clamp(14px, 3.4vw, 22px); letter-spacing: .5em; color: var(--phos); opacity: 0;
    pointer-events: none; transition: opacity .4s; text-align: center; text-shadow: 0 0 24px rgba(51,255,153,.5);
  }
  #stageword.on { opacity: .95; }
  #stageword.hot { color: var(--hot); text-shadow: 0 0 24px rgba(255,92,92,.5); }
  #stageword small { display: block; font-size: 10px; letter-spacing: .4em; color: var(--dim); margin-top: 10px; }

  /* knob lanes */
  #knobs {
    display: flex; gap: 8px; padding: 8px 10px calc(env(safe-area-inset-bottom) + 10px);
    background: linear-gradient(180deg, rgba(2,5,3,0) 0%, rgba(4,18,11,.85) 30%);
  }
  .lane {
    flex: 1; height: 66px; border: 1px solid var(--line); border-radius: 12px; position: relative;
    background: rgba(4, 18, 11, .65); overflow: hidden; touch-action: none; cursor: ew-resize;
  }
  .lane.off { opacity: .28; cursor: default; }
  .lane .lbl {
    position: absolute; top: 7px; left: 0; right: 0; text-align: center;
    font-size: 9.5px; letter-spacing: .3em; color: var(--dim); pointer-events: none;
  }
  .lane.active { border-color: var(--phos); }
  .lane .groove { position: absolute; left: 12px; right: 12px; top: 38px; height: 2px; background: var(--line); pointer-events: none; }
  .lane .tick {
    position: absolute; top: 27px; width: 3px; height: 24px; background: var(--phos); border-radius: 2px;
    box-shadow: 0 0 8px rgba(51,255,153,.8); pointer-events: none; transform: translateX(-50%);
  }
  .lane .ref { position: absolute; top: 31px; width: 2px; height: 16px; background: var(--ref); opacity: .8; border-radius: 2px; pointer-events: none; transform: translateX(-50%); display: none; }
  .lane.eye .ref { display: block; }
  .lane .chev { position: absolute; top: 30px; font-size: 14px; color: var(--phos); opacity: 0; pointer-events: none; transition: opacity .12s; }
  .lane .chev.l { left: 7px; } .lane .chev.r { right: 7px; }
  .lane .val { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--dim); letter-spacing: .15em; pointer-events: none; }

  #dock {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 6;
  }
  .dockbtn {
    width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 12px;
    background: rgba(4, 18, 11, .8); color: var(--dim); font-size: 16px;
    font-family: inherit; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: color .2s, border-color .2s;
  }
  .dockbtn:hover, .dockbtn.open { color: var(--phos); border-color: var(--phos); }

  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(102%); transition: transform .22s ease-out;
    display: flex; flex-direction: column; z-index: 10;
  }
  #panel.open { transform: none; }
  #panel, #over, #pbody { touch-action: pan-y; }
  @media (max-width: 560px) {
    #panel { top: auto; left: 0; width: 100%; height: 72vh; border-left: none; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; transform: translateY(103%); }
    #panel.open { transform: none; }
  }
  #phead {
    padding: 16px 18px; font-size: 12px; letter-spacing: .3em; color: var(--phos);
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;
  }
  #pclose { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; font-family: inherit; padding: 2px 8px; }
  #pbody { flex: 1; overflow-y: auto; padding: 14px 16px calc(env(safe-area-inset-bottom) + 20px); font-size: 13px; }
  .row {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .row .l { flex: 1; min-width: 0; }
  .row .name { font-size: 13px; color: var(--fg); }
  .row .sub { font-size: 11px; color: var(--dim); margin-top: 3px; line-height: 1.5; }
  .row.codexed .name { color: var(--phos); }
  .row.unknown { opacity: .5; }
  .row.cursedr .name { color: var(--hot); }
  .bigbtn {
    width: 100%; font-family: inherit; font-size: 14px; letter-spacing: .15em; padding: 14px;
    background: transparent; border: 1px solid var(--phos); color: var(--phos);
    border-radius: 10px; cursor: pointer; margin: 10px 0;
  }
  .bigbtn.danger { border-color: var(--hot); color: var(--hot); }
  .note { color: var(--dim); font-size: 11.5px; line-height: 1.7; margin: 8px 0; }
  .stat { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; color: var(--dim); }
  .stat b { color: var(--fg); font-weight: 500; }
  h4 { font-size: 11px; letter-spacing: .3em; color: var(--phos); margin: 18px 0 8px; font-weight: 500; }
  .achgrid { display: flex; flex-wrap: wrap; gap: 6px; }
  .ach { font-size: 10.5px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); }
  .ach.got { border-color: var(--phos); color: var(--phos); }

  #toasts {
    position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 30; pointer-events: none; width: min(420px, 92vw);
  }
  .toast {
    background: var(--panel); border: 1px solid var(--phos); border-radius: 10px;
    padding: 10px 16px; font-size: 12px; text-align: center; color: var(--fg);
    animation: toastin .3s ease-out; box-shadow: 0 4px 30px rgba(0, 0, 0, .6);
  }
  .toast.hot { border-color: var(--hot); color: var(--hot); }
  .toast.fade { opacity: 0; transition: opacity .5s; }
  @keyframes toastin { from { opacity: 0; transform: translateY(-10px); } }

  /* author display rules defeat the hidden attribute — force it */
  #draft {
    position: fixed; inset: 0; background: rgba(2, 5, 3, .9); z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
  }
  #draft[hidden] { display: none !important; }
  #draft h2 { font-size: 13px; letter-spacing: .4em; color: var(--phos); font-weight: 500; margin-bottom: 8px; }
  #draft .sub2 { font-size: 10.5px; letter-spacing: .25em; color: var(--dim); margin-bottom: 22px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .card {
    width: min(200px, 28vw); min-width: 150px; min-height: 168px; padding: 16px 13px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
    color: var(--fg); font-family: inherit; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: border-color .15s, transform .15s; animation: cardin .4s ease-out backwards;
  }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; }
  @keyframes cardin { from { opacity: 0; transform: translateY(16px); } }
  .card:hover { border-color: var(--phos); transform: translateY(-3px); }
  .card.cursed:hover { border-color: var(--hot); }
  .card .g { font-size: 28px; color: var(--phos); }
  .card.cursed .g { color: var(--hot); }
  .card .n { font-size: 12px; letter-spacing: .1em; }
  .card .d { font-size: 11px; color: var(--dim); line-height: 1.55; }
  #skipdraft { margin-top: 20px; background: none; border: none; color: var(--dim); font-family: inherit; font-size: 11px; letter-spacing: .25em; cursor: pointer; padding: 8px; }
  #skipdraft:hover { color: var(--fg); }

  #over {
    position: fixed; inset: 0; background: rgba(2, 5, 3, .97); z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px; overflow-y: auto;
  }
  #over[hidden] { display: none !important; }
  #over h1 { font-size: clamp(20px, 5vw, 36px); letter-spacing: .3em; color: var(--phos); font-weight: 600; text-shadow: 0 0 30px rgba(51,255,153,.4); }
  #over h1.lost { color: var(--hot); text-shadow: 0 0 30px rgba(255,92,92,.4); }
  #over p { color: var(--dim); margin: 16px 0; font-size: 12.5px; line-height: 1.9; max-width: 480px; }
  #over .jsum { color: var(--fg); font-size: 16px; letter-spacing: .15em; margin: 4px 0 10px; }
  #poweron {
    margin-top: 14px; font-family: inherit; font-size: 14px; letter-spacing: .25em; padding: 15px 38px;
    background: transparent; border: 1px solid var(--phos); color: var(--phos);
    border-radius: 10px; cursor: pointer;
  }
  #poweron:hover { background: rgba(51, 255, 153, .08); }
</style>
</head>
<body>

<div id="integ"><div id="integfill"></div></div>

<div id="rig">
  <div id="scopewrap">
    <canvas id="scope"></canvas>
    <div class="chrome" id="c-tl">CH1 <b>∿</b> RUN · <span id="trig" class="lost">WAIT</span></div>
    <div class="chrome" id="c-tr"><span id="signame">—</span><br><b id="bpmtag"></b></div>
    <div class="chrome" id="c-bl" >V/DIV <b id="r-amp">—</b> · F <b id="r-freq">—</b></div>
    <div class="chrome" id="c-br">φ <b id="r-ph">—</b> · ERR <b id="r-err">—</b></div>
    <div id="joules"><div id="jnum">0</div><div id="jsub">JOULES BANKED</div><div id="combo"></div></div>
    <div id="stageword"></div>
    <div id="dock">
      <button class="dockbtn" id="d-rec" data-tab="rec">◉</button>
      <button class="dockbtn" id="d-codex" data-tab="codex">⌁</button>
      <button class="dockbtn" id="d-log" data-tab="log">☰</button>
    </div>
  </div>
  <div id="knobs">
    <div class="lane" id="lane-A" data-p="A">
      <div class="lbl">VOLTS / DIV</div>
      <div class="groove"></div><div class="tick"></div><div class="ref"></div>
      <span class="chev l">‹</span><span class="chev r">›</span>
      <div class="val"></div>
    </div>
    <div class="lane" id="lane-F" data-p="F">
      <div class="lbl">FREQUENCY</div>
      <div class="groove"></div><div class="tick"></div><div class="ref"></div>
      <span class="chev l">‹</span><span class="chev r">›</span>
      <div class="val"></div>
    </div>
    <div class="lane" id="lane-P" data-p="P">
      <div class="lbl">PHASE</div>
      <div class="groove"></div><div class="tick"></div><div class="ref"></div>
      <span class="chev l">‹</span><span class="chev r">›</span>
      <div class="val"></div>
    </div>
  </div>
</div>

<aside id="panel">
  <div id="phead"><span id="ptitle"></span><button id="pclose">✕</button></div>
  <div id="pbody"></div>
</aside>

<div id="toasts"></div>
<div id="draft" hidden></div>
<div id="over" hidden></div>

<script>
'use strict';
/* ============================================================
   PHOSPHOR — night shift on the installation.
   An oscilloscope roguelike: ride three knobs (amplitude,
   frequency, phase) to keep your trace locked onto a reference
   that drifts and glitches on a beat grid. Locked time banks
   joules and charges integrity; unlocked time drains it. Clear a
   signal, draft a component, the drift accelerates — blackout is
   inevitable. Score is joules. Nothing persists but knowledge.
   Pure DOM-free seeded core (headless harnesses drive this file).
   ============================================================ */

// ---------- balance tables ----------
const TUNE = {
  bars: 8, beatsPerBar: 4,
  bpm0: 78, bpmPer: 7, bpmCap: 150,
  knobsAt: [1, 2, 3],              // stage 1: A · stage 2: +F · stage 3: +P
  thr: 0.12, wideMult: 1.4,
  drain0: 0.045, drainPer: 0.030, drainLate: 1.22, drainLateFrom: 5,
  charge: 0.11,
  lfoA0: 0.080, lfoAPer: 0.030,
  lfoF0: 0.070, lfoFPer: 0.027,
  lfoP0: 0.060, lfoPPer: 0.027,
  walk0: 0.015, walkPer: 0.011,    // per beat
  glitchFrom: 3, glitchP0: 0.18, glitchPPer: 0.06, glitchPCap: 0.55,
  glitchSz0: 0.12, glitchSzPer: 0.030,
  jr0: 9, jrGrow: 1.5,             // joules/s locked
  bonus0: 70, bonusGrow: 1.5,
  comboPer: 0.08, comboCap: 25,
  integRefill: 0.35,
  afcRate: 0.35, servoRate: 0.12, pllSnap: 0.06, pllRate: 1.6,
  holdSlow: 0.5, holdDur: 2.0,
  fuseRestore: 0.30,
};

const COMPS = [
  { id: 'afc',   g: '∿', cursed: 0, name: 'AFC LOOP',         desc: 'Frequency error self-corrects 35% per second.' },
  { id: 'pll',   g: '⌁', cursed: 0, name: 'PLL',              desc: 'Near lock, phase snaps onto the reference.' },
  { id: 'servo', g: '⟲', cursed: 0, name: 'SERVO ASSIST',     desc: 'All errors self-correct 12% per second.' },
  { id: 'ocxo',  g: '◫', cursed: 0, name: 'CRYSTAL OVEN',     desc: 'The reference frequency drifts 50% less.' },
  { id: 'atten', g: '⍖', cursed: 0, name: 'ATTENUATOR',       desc: 'Amplitude drifts 50% less.' },
  { id: 'dline', g: '⌒', cursed: 0, name: 'DELAY LINE',       desc: 'Phase drifts 50% less.' },
  { id: 'notch', g: '⋔', cursed: 0, name: 'NOTCH FILTER',     desc: 'Transients hit 50% softer.' },
  { id: 'wide',  g: '⊞', cursed: 0, name: 'WIDEBAND TRIGGER', desc: 'The lock window is 40% wider.' },
  { id: 'cap',   g: '⊐', cursed: 0, name: 'CAPACITOR BANK',   desc: 'Integrity max +50% — and refilled now.' },
  { id: 'mem',   g: '▤', cursed: 0, name: 'PHOSPHOR MEMORY',  desc: 'Integrity drains 25% slower.' },
  { id: 'hold',  g: '◴', cursed: 0, name: 'TRIGGER HOLD',     desc: 'After a transient, time crawls for 2 seconds.' },
  { id: 'fuse',  g: '⏚', cursed: 0, name: 'SURGE PROTECTOR',  desc: 'The first blackout each run leaves you at 30% instead.' },
  { id: 'eye',   g: '◉', cursed: 0, name: 'SPECTRUM EYE',     desc: 'Reference marks appear on the knobs.' },
  { id: 'oc',    g: '↯', cursed: 1, name: 'OVERCLOCK',        desc: 'Joules ×2 · the drift ×1.5.' },
  { id: 'burn',  g: '♨', cursed: 1, name: 'BURN-IN',          desc: 'Charge ×2 · drain ×2.' },
  { id: 'gain',  g: '▦', cursed: 1, name: 'HOT GAIN STAGE',   desc: 'Joules ×1.5 · the knobs are 60% twitchier.' },
  { id: 'crt',   g: '◬', cursed: 1, name: 'CRACKED CRT',      desc: 'Joules ×1.6 · the beam jitters.' },
];

const SIGNAMES = ['FILAMENT WARMER', 'CLOCK TREE', 'PSU RAIL', 'COIL DRIVER', 'ANTENNA ARRAY',
  'MAGNETRON', 'ION PUMP', 'FLUX GATE', 'CRYO REGULATOR', 'BEAM STEERING', 'REACTOR PHASE', 'THE CARRIER'];
function signame(s) { return s <= SIGNAMES.length ? SIGNAMES[s - 1] : 'SECTOR ' + s; }

const MARKS = [
  { id: 'lock1',   name: 'First Lock' },
  { id: 'bar1',    name: 'Clean Bar' },
  { id: 'combo8',  name: 'Eight Bars Tight' },
  { id: 'stage3',  name: 'Past the Rail' },
  { id: 'stage5',  name: 'Deep Plant' },
  { id: 'stage8',  name: 'Night Shift Legend' },
  { id: 'j1k',     name: 'Kilojoule Run' },
  { id: 'j10k',    name: 'Megawatt Heart' },
  { id: 'fuse1',   name: 'Saved by the Fuse' },
  { id: 'perfect', name: 'Perfect Signal' },
  { id: 'comps5',  name: 'Tinkerer' },
  { id: 'codexall',name: 'Full Schematic' },
  { id: 'death5',  name: 'Five Blackouts' },
  { id: 'oc1',     name: 'Overclocked Clear' },
];

// ---------- seeded rng ----------
function mulberry(s) {
  s |= 0; s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return [(((t ^ (t >>> 14)) >>> 0) / 4294967296), s];
}
function rng(R) { const [v, s] = mulberry(R.rs); R.rs = s; return v; }

// ---------- meta (knowledge only) ----------
const META_KEY = 'phos-meta-v1', RUN_KEY = 'phos-run-v1';
function freshMeta() {
  return { v: 1, sound: true, runs: 0, deaths: 0, lifeJoules: 0, bestStage: 0, bestJoules: 0,
    bestCombo: 0, codex: {}, marks: {}, seenHow: false, last: null };
}
let M = freshMeta();
function loadMeta() {
  try {
    const raw = localStorage.getItem(META_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    const f = freshMeta();
    for (const k of Object.keys(f)) if (k in d) f[k] = d[k];
    M = f;
  } catch (e) {}
}
function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(M)); } catch (e) {} }

// ---------- formatting ----------
const SUFF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return n >= 100 || n % 1 === 0 ? String(Math.floor(n)) : n.toFixed(1);
  if (n < 1e6) return Math.floor(n).toLocaleString('en-US');
  const e = Math.floor(Math.log10(n));
  const t = Math.floor(e / 3);
  if (t < SUFF.length) {
    const m = n / Math.pow(10, t * 3);
    return (m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2)) + SUFF[t];
  }
  return (n / Math.pow(10, e)).toFixed(2) + 'e' + e;
}

// ============================================================
// PURE CORE — no DOM, no clocks, no unseeded randomness.
// ============================================================

function newRun(seed) {
  const R = {
    v: 1, seed: seed >>> 0, rs: seed >>> 0,
    stage: 0, st: 0, beat: -1, bar: -1,
    tgt: { A: 0.5, F: 0.5, P: 0.5 },
    base: { A: 0.5, F: 0.5, P: 0.5 },
    lfoPh: { A: 0, F: 0, P: 0 },
    walk: { A: 0, F: 0, P: 0 },
    you: { A: 0.5, F: 0.5, P: 0.5 },
    glitchAt: -1, glitchParam: null, warned: false,
    slowT: 0, lock: false, lockedInBeat: 0,
    integ: 1, joules: 0, stageJoules: 0, lockTime: 0, stageTime: 0,
    combo: 0, bestCombo: 0,
    comps: [], draft: null, over: null, fuseUsed: false,
    stats: { glitches: 0, locks: 0, perfectStages: 0, drafts: 0 },
  };
  startStage(R, 1);
  return R;
}
function hasC(R, id) { return R.comps.indexOf(id) >= 0; }

function conf(R) {
  const s = R.stage;
  const driftScale = (hasC(R, 'oc') ? 1.5 : 1);
  const bpm = Math.min(TUNE.bpmCap, TUNE.bpm0 + TUNE.bpmPer * (s - 1));
  const beatLen = 60 / bpm;
  let drain = (TUNE.drain0 + TUNE.drainPer * (s - 1)) * Math.pow(TUNE.drainLate, Math.max(0, s - TUNE.drainLateFrom));
  if (hasC(R, 'mem')) drain *= 0.75;
  if (hasC(R, 'burn')) drain *= 2;
  let charge = TUNE.charge * (hasC(R, 'burn') ? 2 : 1);
  return {
    bpm, beatLen, dur: TUNE.bars * TUNE.beatsPerBar * beatLen,
    knobs: s >= 3 ? ['A', 'F', 'P'] : s === 2 ? ['A', 'F'] : ['A'],
    thr: TUNE.thr * (hasC(R, 'wide') ? TUNE.wideMult : 1),
    drain, charge,
    integCap: hasC(R, 'cap') ? 1.5 : 1,
    lfo: {
      A: (TUNE.lfoA0 + TUNE.lfoAPer * (s - 1)) * (hasC(R, 'atten') ? 0.5 : 1) * driftScale,
      F: (TUNE.lfoF0 + TUNE.lfoFPer * (s - 1)) * (hasC(R, 'ocxo') ? 0.5 : 1) * driftScale,
      P: (TUNE.lfoP0 + TUNE.lfoPPer * (s - 1)) * (hasC(R, 'dline') ? 0.5 : 1) * driftScale,
    },
    walkStep: {
      A: (TUNE.walk0 + TUNE.walkPer * (s - 1)) * (hasC(R, 'atten') ? 0.5 : 1) * driftScale,
      F: (TUNE.walk0 + TUNE.walkPer * (s - 1)) * (hasC(R, 'ocxo') ? 0.5 : 1) * driftScale,
      P: (TUNE.walk0 + TUNE.walkPer * (s - 1)) * (hasC(R, 'dline') ? 0.5 : 1) * driftScale,
    },
    glitchP: s < TUNE.glitchFrom ? 0 : Math.min(TUNE.glitchPCap, TUNE.glitchP0 + TUNE.glitchPPer * (s - TUNE.glitchFrom)),
    glitchSz: (TUNE.glitchSz0 + TUNE.glitchSzPer * (s - 1)) * (hasC(R, 'notch') ? 0.5 : 1),
    jr: TUNE.jr0 * Math.pow(TUNE.jrGrow, s - 1)
      * (hasC(R, 'oc') ? 2 : 1) * (hasC(R, 'crt') ? 1.6 : 1) * (hasC(R, 'gain') ? 1.5 : 1),
    bonus: TUNE.bonus0 * Math.pow(TUNE.bonusGrow, s - 1),

}

function startStage(R, s) {

  R.lockedInBeat = 0; R.stageJoules = 0; R.lockTime = 0; R.stageTime = 0;
  R.glitchAt = -1; R.glitchParam = null; R.warned = false; R.slowT = 0;
  for (const p of ['A', 'F', 'P']) {
    R.base[p] = 0.3 + rng(R) * 0.4;
    R.lfoPh[p] = rng(R);
    R.walk[p] = 0;
  }
  const c = conf(R);
  R.integ = s === 1 ? c.integCap : Math.min(c.integCap, R.integ + TUNE.integRefill);
}

function wrapP(x) { x %= 1; return x < 0 ? x + 1 : x; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

function errOf(R) {
  const c = conf(R);
  const eA = Math.abs(R.you.A - R.tgt.A);
  const eF = Math.abs(R.you.F - R.tgt.F);
  let dP = Math.abs(R.you.P - R.tgt.P) % 1;
  if (dP > 0.5) dP = 1 - dP;
  const eP = dP * 2; // normalize: max wrap distance 0.5 → 1
  const errs = { A: eA, F: c.knobs.indexOf('F') >= 0 ? eF : 0, P: c.knobs.indexOf('P') >= 0 ? eP : 0 };
  let E = 0, worst = 'A';
  for (const p of c.knobs) if (errs[p] >= E) { E = errs[p]; worst = p; }
  return { errs, E, worst, thr: c.thr };
}

function updateTarget(R, c) {
  const barLen = c.beatLen * TUNE.beatsPerBar;
  for (const p of ['A', 'F', 'P']) {
    const lfo = c.lfo[p] * Math.sin(2 * Math.PI * (R.st / (barLen * 2) + R.lfoPh[p]));
    const raw = R.base[p] + lfo + R.walk[p];
    R.tgt[p] = p === 'P' ? wrapP(raw) : clamp01(raw);
  }
  // knobs the player doesn't have yet track automatically (teaches one axis at a time)
  for (const p of ['A', 'F', 'P']) if (c.knobs.indexOf(p) < 0) R.you[p] = R.tgt[p];
}

function applyAssists(R, c, dt) {
  const pull = (p, rate) => {
    if (c.knobs.indexOf(p) < 0) return;
    let d = R.tgt[p] - R.you[p];
    if (p === 'P') { d = ((d % 1) + 1.5) % 1 - 0.5; }
    R.you[p] += d * Math.min(1, rate * dt);
    if (p === 'P') R.you[p] = wrapP(R.you[p]); else R.you[p] = clamp01(R.you[p]);
  };
  if (hasC(R, 'afc')) pull('F', TUNE.afcRate);
  if (hasC(R, 'servo')) { pull('A', TUNE.servoRate); pull('F', TUNE.servoRate); pull('P', TUNE.servoRate); }
  if (hasC(R, 'pll')) {
    let dP = Math.abs(R.you.P - R.tgt.P) % 1; if (dP > 0.5) dP = 1 - dP;
    if (dP * 2 < TUNE.pllSnap * 2) pull('P', TUNE.pllRate);
  }
}

function step(R, dtReal) {
  const ev = [];
  if (R.over || R.draft) return ev;
  const c = conf(R);
  let dt = dtReal;
  if (R.slowT > 0) { R.slowT -= dtReal; dt = dtReal * TUNE.holdSlow; }
  R.st += dt; R.stageTime += dt;

  // beat grid
  const beatIdx = Math.floor(R.st / c.beatLen);
  if (beatIdx !== R.beat) {
    // close out previous beat: combo bookkeeping
    if (R.beat >= 0) {
      const frac = R.lockedInBeat / c.beatLen;
      if (frac >= 0.85) {
        R.combo++; R.bestCombo = Math.max(R.bestCombo, R.combo);
        const jBeat = c.jr * c.beatLen * (1 + TUNE.comboPer * Math.min(TUNE.comboCap, R.combo));
        ev.push({ t: 'lockbeat', combo: R.combo, j: jBeat });
      } else if (R.combo > 0) { R.combo = 0; ev.push({ t: 'combobreak' }); }
    }
    R.beat = beatIdx; R.lockedInBeat = 0;
    const beatInBar = beatIdx % TUNE.beatsPerBar;
    ev.push({ t: 'beat', n: beatIdx, inBar: beatInBar });
    if (beatInBar === 0) {
      R.bar++;
      ev.push({ t: 'bar', n: R.bar });
      // roll a transient for this bar: warn on beat 1, hit on beat 2
      if (c.glitchP > 0 && rng(R) < c.glitchP) {
        R.glitchAt = beatIdx + 2;
        const ps = c.knobs;
        R.glitchParam = ps[Math.floor(rng(R) * ps.length)];
        R.warned = false;
      }
    }
    if (R.glitchAt >= 0 && beatIdx === R.glitchAt - 1 && !R.warned) {
      R.warned = true;
      ev.push({ t: 'warn', p: R.glitchParam });
    }
    if (R.glitchAt >= 0 && beatIdx === R.glitchAt) {
      const dir = rng(R) < 0.5 ? -1 : 1;
      const sz = c.glitchSz * (0.8 + rng(R) * 0.5);
      R.walk[R.glitchParam] += dir * sz;
      R.stats.glitches++;
      ev.push({ t: 'glitch', p: R.glitchParam, sz: dir * sz });
      R.glitchAt = -1;
      if (hasC(R, 'hold')) R.slowT = TUNE.holdDur;
    }
    // random walk steps land on beats (the drift is rhythmic)
    for (const p of ['A', 'F', 'P']) {
      R.walk[p] += (rng(R) - 0.5) * 2 * c.walkStep[p];
      // walk decays gently toward 0 so targets stay in range
      R.walk[p] *= 0.985;
    }
  }

  updateTarget(R, c);
  applyAssists(R, c, dt);

  const e = errOf(R);
  const wasLock = R.lock;
  R.lock = e.E < c.thr;
  if (R.lock && !wasLock) { R.stats.locks++; ev.push({ t: 'lock', on: true }); }
  if (!R.lock && wasLock) ev.push({ t: 'lock', on: false });

  if (R.lock) {
    R.lockedInBeat += dt; R.lockTime += dt;
    const jr = c.jr * (1 + TUNE.comboPer * Math.min(TUNE.comboCap, R.combo));
    R.joules += jr * dt; R.stageJoules += jr * dt;
    R.integ = Math.min(c.integCap, R.integ + c.charge * dt);
  } else {
    R.integ -= c.drain * dt;
    if (R.integ <= 0) {
      if (hasC(R, 'fuse') && !R.fuseUsed) {
        R.fuseUsed = true; R.integ = TUNE.fuseRestore * c.integCap;
        ev.push({ t: 'fuse' });
      } else {
        R.integ = 0;
        R.over = { cause: 'blackout', stage: R.stage, joules: R.joules };
        ev.push({ t: 'blackout' });
        return ev;
      }
    }
  }

  // stage clear
  if (R.st >= c.dur) {
    const lockFrac = R.lockTime / R.stageTime;
    const bonus = c.bonus * R.integ;
    R.joules += bonus;
    if (lockFrac >= 0.95) R.stats.perfectStages++;
    ev.push({ t: 'clear', stage: R.stage, bonus, lockFrac, oc: hasC(R, 'oc') });
    R.draft = { offers: draftOffers(R) };
    ev.push({ t: 'draft', offers: R.draft.offers });
  }
  return ev;
}

function draftOffers(R) {
  const pool = COMPS.map(x => x.id).filter(id => !hasC(R, id));
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rng(R) * (i + 1));
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  return pool.slice(0, Math.min(3, pool.length));
}
function chooseComp(R, id) {

  if (id && R.draft.offers.indexOf(id) < 0) return null;
  if (id) { R.comps.push(id); R.stats.drafts++; }
  if (id === 'cap') R.integ = 99; // "refilled now" — startStage clamps to the new cap
  R.draft = null;
  startStage(R, R.stage + 1);
  return { t: 'next', stage: R.stage };
}

function nudgeKnob(R, p, d) {
  if (R.over || R.draft) return;
  const c = conf(R);
  if (c.knobs.indexOf(p) < 0) return;
  const sens = hasC(R, 'gain') ? 1.6 : 1;
  const v = R.you[p] + d * sens;
  R.you[p] = p === 'P' ? wrapP(v) : clamp01(v);
}

// DOM LAYER

const scopewrap = document.getElementById('scopewrap');
const scope = document.getElementById('scope');
const sctx = scope.getContext('2d');
const trigEl = document.getElementById('trig');
const signameEl = document.getElementById('signame');
const bpmtag = document.getElementById('bpmtag');
const jnum = document.getElementById('jnum');
const comboEl = document.getElementById('combo');
const integEl = document.getElementById('integ');
const integfill = document.getElementById('integfill');
const stageword = document.getElementById('stageword');
const rAmp = document.getElementById('r-amp'), rFreq = document.getElementById('r-freq'),
      rPh = document.getElementById('r-ph'), rErr = document.getElementById('r-err');
const panel = document.getElementById('panel');
const ptitle = document.getElementById('ptitle');
const pbody = document.getElementById('pbody');
const toastsEl = document.getElementById('toasts');
const draftEl = document.getElementById('draft');
const overEl = document.getElementById('over');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let R = null;

function resizeScope() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  scope.width = scope.clientWidth * dpr; scope.height = scope.clientHeight * dpr;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resizeScope);

// ---------- pops (floating numbers) ----------
let parts = [];
function pop(x, y, txt, hot) {
  if (parts.length > (reducedMotion ? 30 : 120)) parts.shift();
  parts.push({ x, y, vx: (Math.random() - 0.5) * 18, vy: -42 - Math.random() * 26, t: 0, life: 1.1, txt, hot });
}
function drawParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const k = p.t / p.life;
    sctx.globalAlpha = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85;
    sctx.font = '13px ui-monospace, Menlo, Consolas, monospace';
    sctx.fillStyle = p.hot ? '#ff5c5c' : '#33ff99';
    sctx.textAlign = 'center';
    sctx.fillText(p.txt, p.x, p.y);
  }
  sctx.globalAlpha = 1;
}

// ---------- scope rendering ----------
let scrollT = 0;
function traceY(v, x01, mid, half) {
  const cyc = 1 + v.F * 5;
  return mid - (0.15 + 0.8 * v.A) * half * Math.sin(2 * Math.PI * (x01 * cyc + v.P) - scrollT * 2.2);
}
function drawScope(dt) {
  const W = scope.clientWidth, H = scope.clientHeight;
  scrollT += dt;
  // phosphor persistence: translucent wipe
  sctx.globalAlpha = 1;
  sctx.fillStyle = 'rgba(2,5,3,0.34)';
  sctx.fillRect(0, 0, W, H);
  // graticule
  sctx.strokeStyle = 'rgba(51,255,153,0.07)';
  sctx.lineWidth = 1;
  sctx.beginPath();
  for (let i = 1; i < 10; i++) { const x = W * i / 10; sctx.moveTo(x, 0); sctx.lineTo(x, H); }
  for (let i = 1; i < 8; i++) { const y = H * i / 8; sctx.moveTo(0, y); sctx.lineTo(W, y); }
  sctx.stroke();
  sctx.strokeStyle = 'rgba(51,255,153,0.13)';
  sctx.beginPath();
  sctx.moveTo(W / 2, 0); sctx.lineTo(W / 2, H);
  sctx.moveTo(0, H / 2); sctx.lineTo(W, H / 2);
  sctx.stroke();
  if (!R) return;
  const mid = H * 0.52, half = H * 0.36;
  const jitter = hasC(R, 'crt') ? 1.6 : 0;
  // reference trace (dashed amber)
  sctx.setLineDash([6, 7]);
  sctx.strokeStyle = 'rgba(255,179,71,0.5)';
  sctx.lineWidth = 1.4;
  sctx.beginPath();
  for (let x = 0; x <= W; x += 4) {
    const y = traceY(R.tgt, x / W, mid, half);
    x === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
  }
  sctx.stroke();
  sctx.setLineDash([]);
  // your trace (phosphor glow: 3 passes)
  const lockBright = R.lock ? 1 : 0.62;
  const passes = [
    { w: 7, a: 0.08 * lockBright }, { w: 3.2, a: 0.25 * lockBright }, { w: 1.6, a: 0.95 * lockBright },
  ];
  for (const ps of passes) {
    sctx.strokeStyle = 'rgba(51,255,153,' + ps.a + ')';
    sctx.lineWidth = ps.w;
    sctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const y = traceY(R.you, x / W, mid, half) + (jitter ? (Math.random() - 0.5) * jitter * 2 : 0);
      x === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
    }
    sctx.stroke();
  }
  // beat pulse ring on locked beats handled via pops; subtle beat tick on center line
  const c = conf(R);
  const beatFrac = (R.st % c.beatLen) / c.beatLen;
  if (beatFrac < 0.12 && !R.over) {
    sctx.globalAlpha = (0.12 - beatFrac) / 0.12 * (R.lock ? 0.5 : 0.15);
    sctx.strokeStyle = R.lock ? '#33ff99' : '#2e5c44';
    sctx.lineWidth = 2;
    sctx.strokeRect(3, 3, W - 6, H - 6);
    sctx.globalAlpha = 1;
  }
}

// ---------- sound (synth; must fail silent) ----------
let AC = null, youOsc = null, youGain = null, refOsc = null, refGain = null, audioOn = false;
function ac() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  return AC;
}
function tone(freq, dur, type, gainV, when) {
  const a = ac();
  if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + (when || 0);
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(gainV, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function startDrone() {
  if (audioOn || !M.sound) return;
  try {
    const a = ac(); if (!a) return;
    youOsc = a.createOscillator(); youGain = a.createGain();
    youOsc.type = 'triangle'; youGain.gain.value = 0;
    youOsc.connect(youGain); youGain.connect(a.destination);
    youOsc.start();
    refOsc = a.createOscillator(); refGain = a.createGain();
    refOsc.type = 'sine'; refGain.gain.value = 0;
    refOsc.connect(refGain); refGain.connect(a.destination);
    refOsc.start();
    audioOn = true;
  } catch (e) {}
}
function stopDrone() {
  try {
    if (youOsc) { youOsc.stop(); youOsc = null; }
    if (refOsc) { refOsc.stop(); refOsc = null; }
  } catch (e) {}
  audioOn = false;
}
function fHz(v) { return 110 * Math.pow(2, v * 1.585); } // 110..330 Hz
function updateDrone() {
  if (!audioOn || !AC) return;
  try {
    const t = AC.currentTime;
    if (!R || R.over || R.draft) {
      youGain.gain.setTargetAtTime(0, t, 0.1);
      refGain.gain.setTargetAtTime(0, t, 0.1);
      return;
    }
    youOsc.frequency.setTargetAtTime(fHz(R.you.F), t, 0.04);
    refOsc.frequency.setTargetAtTime(fHz(R.tgt.F), t, 0.04);
    youGain.gain.setTargetAtTime(0.028 * (0.4 + 0.6 * R.you.A), t, 0.08);
    // reference fades when locked — consonance as reward; beating audible when detuned
    refGain.gain.setTargetAtTime(R.lock ? 0.004 : 0.016, t, 0.12);
  } catch (e) {}
}
function sfx(kind, x) {
  if (!M.sound) return;
  try {
    if (kind === 'tick') tone(x ? 1320 : 880, 0.03, 'square', x ? 0.022 : 0.014);
    else if (kind === 'lockbeat') { const h = 220 * (2 + Math.min(6, Math.floor((x || 0) / 4))); tone(h, 0.09, 'sine', 0.035); }
    else if (kind === 'lockon') { tone(660, 0.07, 'sine', 0.04); tone(990, 0.09, 'sine', 0.035, 0.04); }
    else if (kind === 'warn') { tone(1200, 0.09, 'sawtooth', 0.03); tone(1500, 0.09, 'sawtooth', 0.03, 0.1); }
    else if (kind === 'glitch') { tone(140, 0.18, 'sawtooth', 0.06); tone(98, 0.22, 'square', 0.04, 0.04); }
    else if (kind === 'clear') { tone(440, 0.14, 'sine', 0.05); tone(554, 0.16, 'sine', 0.05, 0.1); tone(659, 0.3, 'sine', 0.05, 0.2); }
    else if (kind === 'fuse') { tone(220, 0.3, 'square', 0.05); tone(330, 0.3, 'sine', 0.05, 0.12); }
    else if (kind === 'blackout') { tone(180, 1.2, 'sawtooth', 0.07); tone(60, 1.6, 'sine', 0.09, 0.2); }
    else if (kind === 'draftbell') { tone(523, 0.2, 'triangle', 0.04); tone(784, 0.3, 'sine', 0.04, 0.1); }
    else if (kind === 'mark') { tone(523, 0.12, 'triangle', 0.05); tone(784, 0.2, 'sine', 0.05, 0.1); }
  } catch (e) {}
}

// ---------- toasts / marks ----------
function toast(msg, kind) {

function grantMark(id) {

  if (R.bestCombo >= 32) grantMark('combo8');
  if (R.stage >= 3) grantMark('stage3');
  if (R.stage >= 5) grantMark('stage5');

// ---------- run lifecycle ----------
function startRun() {

  overEl.hidden = true; draftEl.hidden = true;
  parts = []; lastJ = '';
  stagewordShow('SIG 01 — ' + signame(1), 'BPM ' + conf(R).bpm + (M.seenHow ? '' : ' · RIDE THE KNOBS — MATCH THE DASHED WAVE'));

}

  if (R.joules > M.bestJoules) M.bestJoules = R.joules;
  if (R.stage > M.bestStage) M.bestStage = R.stage;
  M.bestCombo = Math.max(M.bestCombo, R.bestCombo);

}
function snapshot() {
  if (!R || R.over) return;
  try { localStorage.setItem(RUN_KEY, JSON.stringify(R)); } catch (e) {}
}
function restoreRun() {
  try {
    const raw = localStorage.getItem(RUN_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1 || d.over) return false;
    R = d;
    return true;
  } catch (e) { return false; }
}

// ---------- overlays ----------
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function showBench(lost) {
  let h = '';
  if (lost) {
    const L = M.last;
    h += '<h1 class="lost">S I G N A L   L O S T</h1>' +
      '<p>blackout at SIG ' + String(L.stage).padStart(2, '0') + ' — ' + esc(signame(L.stage)) + '</p>' +
      '<div class="jsum">' + fmt(Math.floor(L.joules)) + ' J BANKED</div>' +
      '<p>' + (L.joules >= M.bestJoules ? 'a new record ⚡<br>' : '') +
      'best ' + fmt(Math.floor(M.bestJoules)) + ' J · deepest SIG ' + String(M.bestStage).padStart(2, '0') +
      ' · lifetime ' + fmt(Math.floor(M.lifeJoules)) + ' J</p>';
  } else {
    h += '<h1>P H O S P H O R</h1>' +
      '<p>night shift at the installation. every subsystem sings a reference wave —<br>' +
      'your job is to make the bright trace match the dashed one and HOLD it.<br><br>' +
      'three knobs: <b style="color:var(--fg)">amplitude · frequency · phase</b>. drag them. or use ' +
      '<b style="color:var(--fg)">1/2/3 + arrow keys</b>.<br>' +
      'locked time banks joules and feeds integrity. unlocked time bleeds it.<br>' +
      'the reference drifts on the beat. it gets faster. it always wins, eventually.<br><br>' +
      'tip: listen — when the hum stops wobbling, you are in tune.</p>';
  }
  h += '<button id="poweron">' + (lost ? 'P O W E R   O N' : 'C L O C K   I N') + '</button>';
  overEl.innerHTML = h;
  overEl.hidden = false;
  document.getElementById('poweron').addEventListener('click', () => { ac(); startRun(); });
}
function showDraft(offers) {
  let h = '<h2>S P A R E S   C R A T E</h2><div class="sub2">SIG ' + String(R.stage).padStart(2, '0') +
    ' CLEARED — TAKE ONE COMPONENT</div><div class="cards">';
  for (const id of offers) {
    const cdef = COMPS.find(x => x.id === id);
    const known = !!M.codex[id];
    M.codex[id] = true;
    h += '<button class="card' + (cdef.cursed ? ' cursed' : '') + '" data-id="' + id + '">' +
      '<span class="g">' + cdef.g + '</span>' +
      '<span class="n">' + esc(cdef.name) + '</span>' +
      '<span class="d">' + (known ? esc(cdef.desc) : '— unmarked part · install it to learn it —') + '</span>' +
      '</button>';
  }
  h += '</div><button id="skipdraft">L E A V E   I T</button>';
  draftEl.innerHTML = h;
  draftEl.hidden = false;
  saveMeta();
  sfx('draftbell');
  const next = () => {
    draftEl.hidden = true;
    stagewordShow('SIG ' + String(R.stage).padStart(2, '0') + ' — ' + signame(R.stage), 'BPM ' + conf(R).bpm);
    snapshot(); checkLiveMarks(); renderChrome(true);
  };
  draftEl.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id;
    chooseComp(R, id);
    const cdef = COMPS.find(x => x.id === id);
    toast(cdef.g + ' ' + cdef.name + ' INSTALLED', cdef.cursed ? 'hot' : undefined);
    next();
  }));
  document.getElementById('skipdraft').addEventListener('click', () => { chooseComp(R, null); next(); });
}
let stagewordTimer = 0;
function stagewordShow(big, small, hot) {
  stageword.innerHTML = esc(big) + (small ? '<small>' + esc(small) + '</small>' : '');
  stageword.classList.toggle('hot', !!hot);
  stageword.classList.add('on');
  stagewordTimer = 2.6;
}

// ---------- event application ----------
function applyEvents(ev) {
  for (const e of ev) {
    if (e.t === 'beat') sfx('tick', e.inBar === 0);
    else if (e.t === 'lockbeat') {
      pop(scope.clientWidth / 2 + (Math.random() - 0.5) * 120, scope.clientHeight * 0.3, '+' + fmt(Math.floor(e.j)) + ' J');
      sfx('lockbeat', e.combo);
      jnum.classList.remove('bump'); void jnum.offsetWidth; jnum.classList.add('bump');
    }
    else if (e.t === 'lock' && e.on) sfx('lockon');
    else if (e.t === 'warn') {
      stagewordShow('⚠ TRANSIENT — ' + (e.p === 'A' ? 'AMPLITUDE' : e.p === 'F' ? 'FREQUENCY' : 'PHASE'), null, true);
      sfx('warn');
    }
    else if (e.t === 'glitch') {
      sfx('glitch');
      if (!reducedMotion) { scopewrap.classList.remove('jolt'); void scopewrap.offsetWidth; scopewrap.classList.add('jolt'); }
    }
    else if (e.t === 'fuse') { toast('⏚ SURGE PROTECTOR BLOWS — 30% RESTORED', 'hot'); sfx('fuse'); grantMark('fuse1'); }
    else if (e.t === 'clear') {
      pop(scope.clientWidth / 2, scope.clientHeight * 0.4, '+' + fmt(Math.floor(e.bonus)) + ' J BONUS');
      sfx('clear');
      if (e.lockFrac >= 0.95 && R.stage >= 2) grantMark('perfect');
      if (e.oc) grantMark('oc1');
    }
    else if (e.t === 'draft') showDraft(e.offers);
    else if (e.t === 'blackout') {
      commitRun();
      stopDrone();
      sfx('blackout');
      setTimeout(() => showBench(true), 1100);
    }
  }
}

// ---------- chrome / knobs render ----------
let lastJ = '';
function renderChrome(force) {
  if (!R) return;
  const c = conf(R);
  const e = errOf(R);
  const jtxt = fmt(Math.floor(R.joules));
  if (jtxt !== lastJ || force) { jnum.textContent = jtxt; lastJ = jtxt; }
  comboEl.textContent = R.combo > 0 ? '×' + (1 + TUNE.comboPer * Math.min(TUNE.comboCap, R.combo)).toFixed(2) + ' COMBO ' + R.combo : '';
  comboEl.style.opacity = R.combo > 0 ? 1 : 0;
  trigEl.textContent = R.lock ? "TRIG'D" : 'WAIT';
  trigEl.className = R.lock ? 'lock' : 'lost';
  signameEl.textContent = 'SIG ' + String(R.stage).padStart(2, '0') + ' · ' + signame(R.stage);
  bpmtag.textContent = c.bpm + ' BPM · BAR ' + Math.min(TUNE.bars, R.bar + 1) + '/' + TUNE.bars;
  rAmp.textContent = (0.2 + 1.8 * R.you.A).toFixed(2) + 'V';
  rFreq.textContent = Math.round(fHz(R.you.F)) + 'Hz';
  rPh.textContent = Math.round(R.you.P * 360) + '°';
  rErr.textContent = (e.E * 100).toFixed(0) + '%';
  integfill.style.width = (R.integ / c.integCap * 100) + '%';
  integEl.classList.toggle('low', R.integ < 0.25 * c.integCap);
  // knob lanes
  for (const p of ['A', 'F', 'P']) {
    const lane = document.getElementById('lane-' + p);
    const on = c.knobs.indexOf(p) >= 0;
    lane.classList.toggle('off', !on);
    lane.classList.toggle('eye', on && hasC(R, 'eye'));
    const W = lane.clientWidth, pad = 12;
    const tick = lane.querySelector('.tick');
    tick.style.left = (pad + R.you[p] * (W - 2 * pad)) + 'px';
    const ref = lane.querySelector('.ref');
    ref.style.left = (pad + R.tgt[p] * (W - 2 * pad)) + 'px';
    const chevL = lane.querySelector('.chev.l'), chevR = lane.querySelector('.chev.r');
    if (on && !R.over) {
      let d = R.tgt[p] - R.you[p];
      if (p === 'P') d = ((d % 1) + 1.5) % 1 - 0.5;
      const err = e.errs[p];
      const o = Math.min(1, err / (c.thr * 1.6));
      chevL.style.opacity = d < 0 ? o : 0;
      chevR.style.opacity = d > 0 ? o : 0;
      lane.querySelector('.val').textContent =
        p === 'A' ? (0.2 + 1.8 * R.you[p]).toFixed(2) + ' V' :
        p === 'F' ? Math.round(fHz(R.you[p])) + ' Hz' : Math.round(R.you[p] * 360) + '°';
    } else { chevL.style.opacity = 0; chevR.style.opacity = 0; lane.querySelector('.val').textContent = on ? '' : 'OFFLINE'; }
  }
}

// ---------- input: knob lanes (multi-touch, drag anywhere in lane) ----------
const laneDrags = {}; // pointerId -> {p, lastX}
function laneDown(p, x, id) {
  laneDrags[id] = { p, lastX: x };
  document.getElementById('lane-' + p).classList.add('active');
  ac(); startDrone();
  if (!M.seenHow) { M.seenHow = true; saveMeta(); }
}
function laneMove(id, x) {
  const d = laneDrags[id];
  if (!d || !R) return;
  const lane = document.getElementById('lane-' + d.p);
  const W = Math.max(60, lane.clientWidth - 24);
  nudgeKnob(R, d.p, (x - d.lastX) / W);
  d.lastX = x;
}
function laneUp(id) {
  const d = laneDrags[id];
  if (d) document.getElementById('lane-' + d.p).classList.remove('active');
  delete laneDrags[id];
}
for (const p of ['A', 'F', 'P']) {
  const lane = document.getElementById('lane-' + p);
  lane.addEventListener('pointerdown', e => {
    lane.setPointerCapture && lane.setPointerCapture(e.pointerId);
    laneDown(p, e.clientX, e.pointerId);
  });
  lane.addEventListener('pointermove', e => laneMove(e.pointerId, e.clientX));
  lane.addEventListener('pointerup', e => laneUp(e.pointerId));
  lane.addEventListener('pointercancel', e => laneUp(e.pointerId));
  // touch fallback only where PointerEvent is missing (avoids double-registration)
  if (!window.PointerEvent) {
    lane.addEventListener('touchstart', e => {
      for (const t of e.changedTouches) laneDown(p, t.clientX, 'T' + t.identifier);
    }, { passive: true });
    lane.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) laneMove('T' + t.identifier, t.clientX);
    }, { passive: true });
    lane.addEventListener('touchend', e => { for (const t of e.changedTouches) laneUp('T' + t.identifier); }, { passive: true });
    lane.addEventListener('touchcancel', e => { for (const t of e.changedTouches) laneUp('T' + t.identifier); }, { passive: true });
  }
}
// keyboard: 1/2/3 select, arrows adjust (shift fine)
let kSel = 'A';
addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePanel(); return; }
  if (!R || R.over) return;
  if (R.draft && !draftEl.hidden) {
    const i = parseInt(e.key, 10) - 1;
    const cards = draftEl.querySelectorAll('.card');
    if (i >= 0 && i < cards.length) cards[i].click();
    return;
  }
  if (e.key === '1') kSel = 'A';
  else if (e.key === '2') kSel = 'F';
  else if (e.key === '3') kSel = 'P';
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    ac(); startDrone();
    nudgeKnob(R, kSel, (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 0.004 : 0.016));
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    kSel = kSel === 'A' ? (e.key === 'ArrowUp' ? 'P' : 'F') : kSel === 'F' ? (e.key === 'ArrowUp' ? 'A' : 'P') : (e.key === 'ArrowUp' ? 'F' : 'A');
  }
  document.querySelectorAll('.lane').forEach(l => l.classList.toggle('active', l.dataset.p === kSel));
});

// ---------- panels ----------
let openTab = null;
function openPanel(tab) {
  openTab = tab;
  panel.classList.add('open');
  document.querySelectorAll('.dockbtn').forEach(b => b.classList.toggle('open', b.dataset.tab === tab));
  renderPanel();
}
function closePanel() {
  openTab = null;
  panel.classList.remove('open');
  document.querySelectorAll('.dockbtn').forEach(b => b.classList.remove('open'));
}
document.getElementById('pclose').addEventListener('click', closePanel);
document.querySelectorAll('.dockbtn').forEach(b =>
  b.addEventListener('click', e => {
    e.stopPropagation();
    openTab === b.dataset.tab ? closePanel() : openPanel(b.dataset.tab);
  }));
function renderPanel() {
  if (!openTab) return;
  if (openTab === 'rec') {
    ptitle.textContent = 'R E C O R D S';
    let h = '';
    if (R && !R.over) {
      h += '<h4>THIS SHIFT</h4>' +
        '<div class="stat"><span>joules</span><b>' + fmt(Math.floor(R.joules)) + ' J</b></div>' +
        '<div class="stat"><span>signal</span><b>SIG ' + String(R.stage).padStart(2, '0') + '</b></div>' +
        '<div class="stat"><span>best combo</span><b>' + R.bestCombo + ' beats</b></div>' +
        '<div class="stat"><span>components</span><b>' + R.comps.length + '</b></div>';
    }
    h += '<h4>BESTS</h4>' +
      '<div class="stat"><span>joules (one shift)</span><b>' + fmt(Math.floor(M.bestJoules)) + ' J</b></div>' +
      '<div class="stat"><span>deepest signal</span><b>SIG ' + String(M.bestStage).padStart(2, '0') + '</b></div>' +
      '<div class="stat"><span>best combo</span><b>' + M.bestCombo + ' beats</b></div>' +
      '<h4>LIFETIME</h4>' +
      '<div class="stat"><span>joules</span><b>' + fmt(Math.floor(M.lifeJoules)) + ' J</b></div>' +
      '<div class="stat"><span>shifts</span><b>' + M.runs + '</b></div>' +
      '<div class="stat"><span>blackouts</span><b>' + M.deaths + '</b></div>' +
      '<h4>MARKS · ' + Object.keys(M.marks).length + '/' + MARKS.length + '</h4><div class="achgrid">' +
      MARKS.map(mk => '<span class="ach' + (M.marks[mk.id] ? ' got' : '') + '">' + esc(mk.name) + '</span>').join('') + '</div>';
    pbody.innerHTML = h;
  } else if (openTab === 'codex') {
    ptitle.textContent = 'S C H E M A T I C';
    pbody.innerHTML = '<p class="note">One component offered after every cleared signal. A part must be offered once before its label is legible.</p>' +
      COMPS.map(cdef => {
        const known = !!M.codex[cdef.id];
        const held = R && !R.over && hasC(R, cdef.id);
        return '<div class="row ' + (known ? 'codexed' : 'unknown') + (cdef.cursed ? ' cursedr' : '') + '">' +
          '<div class="l"><div class="name">' + cdef.g + '  ' + (known ? esc(cdef.name) : '— ? —') + (held ? ' · installed' : '') + '</div>' +
          '<div class="sub">' + (known ? esc(cdef.desc) : 'not yet encountered') + '</div></div></div>';
      }).join('');
  } else if (openTab === 'log') {
    ptitle.textContent = 'M A N U A L';
    pbody.innerHTML =
      '<p class="note">Match the bright trace to the dashed reference: drag the three knob lanes (or keys 1/2/3 + ←/→, shift for fine). ' +
      'When every error is inside the lock window, the trigger reads TRIG\'D — locked time banks joules and recharges integrity (top edge). ' +
      'Unlocked time drains it. Integrity at zero is a blackout: shift over.</p>' +
      '<p class="note">The reference drifts on the beat and throws transients (telegraphed one beat ahead). Each cleared signal offers one component — and raises the BPM, the drift, and the drain. ' +
      'The chevrons ‹ › point the way; by ear, detune sounds like wobble — when the hum settles, you are locked.</p>' +
      '<p class="note">Nothing persists but knowledge: marks, the schematic, your records.</p>' +
      (M.last ? '<h4>LAST SHIFT</h4><div class="stat"><span>SIG ' + String(M.last.stage).padStart(2, '0') + '</span><b>' +
        fmt(Math.floor(M.last.joules)) + ' J</b></div>' : '') +
      '<h4>SETTINGS</h4>' +
      '<button class="bigbtn" data-act="sound">SOUND ' + (M.sound ? 'ON' : 'OFF') + '</button>' +
      (R && !R.over ? '<button class="bigbtn danger" data-act="abandon">ABANDON SHIFT (counts as a blackout)</button>' : '') +
      '<button class="bigbtn danger" data-act="wipe">DEGAUSS (forget everything)</button>';
  }
}
pbody.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'sound') {
    M.sound = !M.sound; saveMeta(); renderPanel();
    if (!M.sound) stopDrone(); else if (R && !R.over) startDrone();
  } else if (act === 'abandon') {
    if (R && !R.over) { R.over = { cause: 'abandon', stage: R.stage, joules: R.joules }; commitRun(); stopDrone(); closePanel(); showBench(true); }
  } else if (act === 'wipe') {
    if (confirm('Forget every mark, record and schematic entry?')) {
      try { localStorage.removeItem(META_KEY); localStorage.removeItem(RUN_KEY); } catch (err) {}
      location.reload();
    }
  }
});
let panelHold = false, panelHoldUntil = 0;
panel.addEventListener('pointerdown', () => { panelHold = true; });
panel.addEventListener('pointerup', () => { panelHold = false; panelHoldUntil = performance.now() + 350; });
panel.addEventListener('pointercancel', () => { panelHold = false; panelHoldUntil = performance.now() + 350; });

// ---------- boot & loop ----------
loadMeta();
resizeScope();
const resumed = restoreRun();
if (resumed) {
  toast('THE SHIFT RESUMES');
  stagewordShow('SIG ' + String(R.stage).padStart(2, '0') + ' — ' + signame(R.stage), 'BPM ' + conf(R).bpm);
  if (R.draft) showDraft(R.draft.offers); // run was saved mid-draft
} else showBench(false);

let lastFrame = performance.now(), acc = 0, panelTimer = 0, resumeGrace = 0;
const STEP = 0.02;
let snapTimer = 0;
function frame(now) {
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  dt = Math.min(dt, 0.25); // stalls pause the shift; the plant waits
  if (resumeGrace > 0) { resumeGrace -= dt; dt = 0; }
  if (R && !R.over && !R.draft && overEl.hidden) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 25) { applyEvents(step(R, STEP)); acc -= STEP; n++; if (!R || R.over || R.draft) { acc = 0; break; } }
  }
  drawScope(dt);
  drawParts(dt);
  if (R) renderChrome();
  updateDrone();
  if (stagewordTimer > 0) { stagewordTimer -= dt; if (stagewordTimer <= 0) stageword.classList.remove('on'); }
  panelTimer += dt;
  if (panelTimer > 0.3) {
    panelTimer = 0;
    if (openTab && !panelHold && now > panelHoldUntil) renderPanel();
  }
  snapTimer += dt;
  if (snapTimer > 5) { snapTimer = 0; saveMeta(); snapshot(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('pagehide', () => { saveMeta(); snapshot(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { saveMeta(); snapshot(); stopDrone(); }
  else { lastFrame = performance.now(); acc = 0; resumeGrace = 0.8; if (R && !R.over && M.sound) startDrone(); }
});
</script>
</body>
</html>
