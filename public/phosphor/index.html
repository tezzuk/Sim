<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#020503" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='1' y='13' font-size='13' fill='%2333ff99'>∿</text></svg>" />
<title>PHOSPHOR</title>
<style>
  :root {
    --bg: #020503;
    --fg: #c8ffe0;
    --dim: #2e5c44;
    --phos: #33ff99;
    --ref: #ffb347;
    --hot: #ff5c5c;
    --gold: #ffd75e;
    --panel: #04120b;
    --line: #0d2a1c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }

  #rig { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #scopewrap { position: relative; flex: 1; min-height: 0; cursor: grab; }
  #scope { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scopewrap.shake1 { animation: sh1 .1s linear; }
  #scopewrap.shake2 { animation: sh2 .14s linear; }
  #scopewrap.shake3 { animation: sh3 .22s linear; }
  @keyframes sh1 { 25%{transform:translate(2px,-1px)} 50%{transform:translate(-2px,1px)} 75%{transform:translate(1px,1px)} }
  @keyframes sh2 { 20%{transform:translate(4px,-3px)} 40%{transform:translate(-4px,3px)} 60%{transform:translate(3px,2px)} 80%{transform:translate(-2px,-2px)} }
  @keyframes sh3 { 15%{transform:translate(7px,-5px) rotate(.3deg)} 30%{transform:translate(-7px,5px)} 45%{transform:translate(6px,3px) rotate(-.3deg)} 60%{transform:translate(-5px,-4px)} 75%{transform:translate(3px,3px)} 90%{transform:translate(-2px,1px)} }

  .chrome { position: absolute; font-size: 11px; letter-spacing: .18em; color: var(--dim); pointer-events: none; }
  #c-tl { top: max(10px, env(safe-area-inset-top)); left: 14px; }
  #c-tr { top: max(10px, env(safe-area-inset-top)); right: 14px; text-align: right; }
  #c-tl b, #c-tr b { color: var(--phos); font-weight: 500; }
  #trig.lost { color: var(--hot); animation: blink 1s steps(2) infinite; }
  #trig.lock { color: var(--phos); }
  @keyframes blink { 50% { opacity: .2; } }

  #joules {
    position: absolute; left: 50%; top: max(34px, calc(env(safe-area-inset-top) + 24px)); transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 4;
  }
  #jnum { font-size: clamp(26px, 6vw, 42px); font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 22px rgba(51, 255, 153, .3); }
  #jnum.bump { animation: bump .14s ease-out; }
  @keyframes bump { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #jsub { font-size: 9.5px; letter-spacing: .35em; color: var(--dim); margin-top: 1px; }
  #combo { font-size: 12px; letter-spacing: .2em; color: var(--gold); opacity: 0; transition: opacity .2s; margin-top: 4px;
    text-shadow: 0 0 12px rgba(255, 215, 94, .5); }

  #integ { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #07140d; z-index: 5; }
  #integfill { height: 100%; width: 100%; background: var(--phos); transition: width .12s linear; box-shadow: 0 0 10px rgba(51,255,153,.6); }
  #integ.low #integfill { background: var(--hot); box-shadow: 0 0 10px rgba(255,92,92,.7); animation: blink 0.6s steps(2) infinite; }

  /* big center callouts */
  #callout {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(1);
    font-size: clamp(18px, 5vw, 34px); letter-spacing: .35em; color: var(--gold); opacity: 0;
    pointer-events: none; text-align: center; font-weight: 700;
    text-shadow: 0 0 30px rgba(255, 215, 94, .6);
  }
  #callout.go { animation: callout .7s ease-out; }
  @keyframes callout { 0% { opacity: 0; transform: translate(-50%,-50%) scale(1.7); } 18% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
  #callout.hot { color: var(--hot); text-shadow: 0 0 30px rgba(255,92,92,.6); }
  #callout.phos { color: var(--phos); text-shadow: 0 0 30px rgba(51,255,153,.6); }

  /* fault direction arrow */
  #arrow {
    position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%);
    font-size: clamp(26px, 7vw, 48px); color: var(--hot); opacity: 0; pointer-events: none;
    text-shadow: 0 0 26px rgba(255, 92, 92, .7); letter-spacing: .1em;
    transition: opacity .15s; animation: pulse_ .5s ease-in-out infinite alternate;
  }
  @keyframes pulse_ { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.12); } }
  #arrowlbl {
    position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .45em; color: var(--hot); opacity: 0; pointer-events: none; transition: opacity .15s;
  }

  /* bottom meter strip (read-only) */
  #meters {
    display: flex; gap: 8px; padding: 8px 10px calc(env(safe-area-inset-bottom) + 10px);
    background: linear-gradient(180deg, rgba(2,5,3,0) 0%, rgba(4,18,11,.85) 30%);
  }
  .meter {
    flex: 1; height: 44px; border: 1px solid var(--line); border-radius: 11px; position: relative;
    background: rgba(4, 18, 11, .65); overflow: hidden; pointer-events: none;
  }
  .meter .lbl { position: absolute; top: 5px; left: 0; right: 0; text-align: center; font-size: 9px; letter-spacing: .28em; color: var(--dim); }
  .meter .groove { position: absolute; left: 10px; right: 10px; top: 28px; height: 2px; background: var(--line); }
  .meter .tick { position: absolute; top: 21px; width: 3px; height: 16px; background: var(--phos); border-radius: 2px;
    box-shadow: 0 0 8px rgba(51,255,153,.8); transform: translateX(-50%); transition: left .06s linear; }
  .meter .tgt { position: absolute; top: 24px; width: 2px; height: 10px; background: var(--ref); border-radius: 2px; transform: translateX(-50%); transition: left .06s linear; }
  .meter.fault { border-color: var(--hot); }
  .meter.fault .lbl { color: var(--hot); }
  .meter.off { opacity: .25; }

  #dock {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 6;
  }
  .dockbtn {
    width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 12px;
    background: rgba(4, 18, 11, .8); color: var(--dim); font-size: 16px;
    font-family: inherit; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: color .2s, border-color .2s;
  }
  .dockbtn:hover, .dockbtn.open { color: var(--phos); border-color: var(--phos); }

  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(102%); transition: transform .22s ease-out;
    display: flex; flex-direction: column; z-index: 10;
  }
  #panel.open { transform: none; }
  #panel, #over, #pbody { touch-action: pan-y; }
  @media (max-width: 560px) {
    #panel { top: auto; left: 0; width: 100%; height: 72vh; border-left: none; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; transform: translateY(103%); }
    #panel.open { transform: none; }
  }
  #phead {
    padding: 16px 18px; font-size: 12px; letter-spacing: .3em; color: var(--phos);
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;
  }
  #pclose { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; font-family: inherit; padding: 2px 8px; }
  #pbody { flex: 1; overflow-y: auto; padding: 14px 16px calc(env(safe-area-inset-bottom) + 20px); font-size: 13px; }
  .row {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .row .l { flex: 1; min-width: 0; }
  .row .name { font-size: 13px; color: var(--fg); }
  .row .sub { font-size: 11px; color: var(--dim); margin-top: 3px; line-height: 1.5; }
  .row.codexed .name { color: var(--phos); }
  .row.unknown { opacity: .5; }
  .row.cursedr .name { color: var(--hot); }
  .bigbtn {
    width: 100%; font-family: inherit; font-size: 14px; letter-spacing: .15em; padding: 14px;
    background: transparent; border: 1px solid var(--phos); color: var(--phos);
    border-radius: 10px; cursor: pointer; margin: 10px 0;
  }
  .bigbtn.danger { border-color: var(--hot); color: var(--hot); }
  .note { color: var(--dim); font-size: 11.5px; line-height: 1.7; margin: 8px 0; }
  .stat { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; color: var(--dim); }
  .stat b { color: var(--fg); font-weight: 500; }
  h4 { font-size: 11px; letter-spacing: .3em; color: var(--phos); margin: 18px 0 8px; font-weight: 500; }
  .achgrid { display: flex; flex-wrap: wrap; gap: 6px; }
  .ach { font-size: 10.5px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); }
  .ach.got { border-color: var(--gold); color: var(--gold); }

  #toasts {
    position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 30; pointer-events: none; width: min(420px, 92vw);
  }
  .toast {
    background: var(--panel); border: 1px solid var(--phos); border-radius: 10px;
    padding: 10px 16px; font-size: 12px; text-align: center; color: var(--fg);
    animation: toastin .3s ease-out; box-shadow: 0 4px 30px rgba(0, 0, 0, .6);
  }
  .toast.hot { border-color: var(--hot); color: var(--hot); }
  .toast.gold { border-color: var(--gold); color: var(--gold); }
  .toast.fade { opacity: 0; transition: opacity .5s; }
  @keyframes toastin { from { opacity: 0; transform: translateY(-10px); } }

  /* author display rules defeat the hidden attribute — force it */
  #draft {
    position: fixed; inset: 0; background: rgba(2, 5, 3, .9); z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
  }
  #draft[hidden] { display: none !important; }
  #draft h2 { font-size: 13px; letter-spacing: .4em; color: var(--phos); font-weight: 500; margin-bottom: 8px; }
  #draft .sub2 { font-size: 10.5px; letter-spacing: .25em; color: var(--dim); margin-bottom: 22px; text-align: center; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .card {
    width: min(200px, 28vw); min-width: 150px; min-height: 168px; padding: 16px 13px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
    color: var(--fg); font-family: inherit; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: border-color .15s, transform .15s; animation: cardin .4s ease-out backwards;
  }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; }
  @keyframes cardin { from { opacity: 0; transform: translateY(16px); } }
  .card:hover { border-color: var(--phos); transform: translateY(-3px); }
  .card.cursed:hover { border-color: var(--hot); }
  .card .g { font-size: 28px; color: var(--phos); }
  .card.cursed .g { color: var(--hot); }
  .card .n { font-size: 12px; letter-spacing: .1em; }
  .card .d { font-size: 11px; color: var(--dim); line-height: 1.55; }
  #skipdraft { margin-top: 20px; background: none; border: none; color: var(--dim); font-family: inherit; font-size: 11px; letter-spacing: .25em; cursor: pointer; padding: 8px; }
  #skipdraft:hover { color: var(--fg); }

  #over {
    position: fixed; inset: 0; background: rgba(2, 5, 3, .97); z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px; overflow-y: auto;
  }
  #over[hidden] { display: none !important; }
  #over h1 { font-size: clamp(20px, 5vw, 36px); letter-spacing: .3em; color: var(--phos); font-weight: 600; text-shadow: 0 0 30px rgba(51,255,153,.4); }
  #over h1.lost { color: var(--hot); text-shadow: 0 0 30px rgba(255,92,92,.4); }
  #over p { color: var(--dim); margin: 16px 0; font-size: 12.5px; line-height: 1.9; max-width: 480px; }
  #over .jsum { color: var(--fg); font-size: 18px; letter-spacing: .15em; margin: 4px 0 10px; }
  #poweron {
    margin-top: 14px; font-family: inherit; font-size: 14px; letter-spacing: .25em; padding: 15px 38px;
    background: transparent; border: 1px solid var(--phos); color: var(--phos);
    border-radius: 10px; cursor: pointer;
  }
  #poweron:hover { background: rgba(51, 255, 153, .08); }
</style>
</head>
<body>

<div id="integ"><div id="integfill"></div></div>

<div id="rig">
  <div id="scopewrap">
    <canvas id="scope"></canvas>
    <div class="chrome" id="c-tl">CH1 <b>∿</b> · <span id="trig" class="lost">WAIT</span></div>
    <div class="chrome" id="c-tr"><span id="signame">—</span><br><b id="bpmtag"></b></div>
    <div id="joules"><div id="jnum">0</div><div id="jsub">JOULES</div><div id="combo"></div></div>
    <div id="callout"></div>
    <div id="arrow"></div>
    <div id="arrowlbl"></div>
    <div id="dock">
      <button class="dockbtn" id="d-rec" data-tab="rec">◉</button>
      <button class="dockbtn" id="d-codex" data-tab="codex">⌁</button>
      <button class="dockbtn" id="d-log" data-tab="log">☰</button>
    </div>
  </div>
  <div id="meters">
    <div class="meter" id="m-A"><div class="lbl">AMPLITUDE</div><div class="groove"></div><div class="tgt"></div><div class="tick"></div></div>
    <div class="meter" id="m-F"><div class="lbl">FREQUENCY</div><div class="groove"></div><div class="tgt"></div><div class="tick"></div></div>
    <div class="meter" id="m-P"><div class="lbl">PHASE</div><div class="groove"></div><div class="tgt"></div><div class="tick"></div></div>
  </div>
</div>

<aside id="panel">
  <div id="phead"><span id="ptitle"></span><button id="pclose">✕</button></div>
  <div id="pbody"></div>
</aside>

<div id="toasts"></div>
<div id="draft" hidden></div>
<div id="over" hidden></div>

<script>
'use strict';
/* ============================================================
   PHOSPHOR — night shift at the installation.
   Snap-fix oscilloscope roguelike. Faults knock ONE parameter of
   the reference at a time (telegraphed one beat ahead); the whole
   screen is the knob — drag anywhere and the wave magnetically
   SNAPS back into lock. Fix speed is rated (INSTANT ×4 / QUICK ×2
   / CLEAN ×1 / SLOW), streaks multiply, joules rain. Open faults
   drain integrity; drain grows without bound: blackout always wins.
   Pure DOM-free seeded core (headless harnesses drive this file).
   ============================================================ */

// ---------- balance tables ----------
const TUNE = {
  bars: 8, beatsPerBar: 4,
  bpm0: 80, bpmPer: 6, bpmCap: 150,
  knobsAt: [1, 2, 3],                 // stage 1: A · 2: +F · 3: +P
  faultSz0: 0.17, faultSzPer: 0.035, faultSzCap: 0.46,
  snapZone: 0.05, wideMult: 1.4,
  minGapBeats: 2,
  instantBeats: 1, quickBeats: 2, cleanBeats: 4,
  spdMult: { instant: 4, quick: 2, clean: 1, slow: 0.4 },
  drain0: 0.06, drainPer: 0.036, drainLate: 1.22, drainLateFrom: 5,
  charge: 0.12,
  fix0: 30, jrGrow: 1.5,              // fix reward base · per-stage growth
  trickle0: 2,                        // joules/s while clean
  comboPer: 0.12, comboCap: 25,
  integRefill: 0.35,
  servoRate: 0.12, pllZoneMult: 2,
  holdSlow: 0.5, holdDur: 2.0,
  fuseRestore: 0.30,
};
function faultsPerBar(s) { return s === 1 ? 0.5 : Math.min(3, 1 + (s - 2) * 0.35); }

const COMPS = [
  { id: 'pll',   g: '⌁', cursed: 0, name: 'PLL',              desc: 'Phase faults snap from twice as far.' },
  { id: 'servo', g: '⟲', cursed: 0, name: 'SERVO ASSIST',     desc: 'Open faults self-heal 12% per second.' },
  { id: 'ocxo',  g: '◫', cursed: 0, name: 'CRYSTAL OVEN',     desc: 'Frequency faults land 50% smaller.' },
  { id: 'atten', g: '⍖', cursed: 0, name: 'ATTENUATOR',       desc: 'Amplitude faults land 50% smaller.' },
  { id: 'dline', g: '⌒', cursed: 0, name: 'DELAY LINE',       desc: 'Phase faults land 50% smaller.' },
  { id: 'notch', g: '⋔', cursed: 0, name: 'NOTCH FILTER',     desc: 'Faults arrive at least one beat further apart.' },
  { id: 'wide',  g: '⊞', cursed: 0, name: 'WIDEBAND TRIGGER', desc: 'The snap zone is 40% wider.' },
  { id: 'cap',   g: '⊐', cursed: 0, name: 'CAPACITOR BANK',   desc: 'Integrity max +50% — and refilled now.' },
  { id: 'mem',   g: '▤', cursed: 0, name: 'PHOSPHOR MEMORY',  desc: 'Integrity drains 25% slower.' },
  { id: 'hold',  g: '◴', cursed: 0, name: 'TRIGGER HOLD',     desc: 'Time crawls for 2 seconds after a fault lands.' },
  { id: 'fuse',  g: '⏚', cursed: 0, name: 'SURGE PROTECTOR',  desc: 'The first blackout each shift leaves you at 30%.' },
  { id: 'eye',   g: '◉', cursed: 0, name: 'SPECTRUM EYE',     desc: 'Telegraphs reveal the fault direction early.' },
  { id: 'oc',    g: '↯', cursed: 1, name: 'OVERCLOCK',        desc: 'Joules ×2 · faults land 50% bigger.' },
  { id: 'burn',  g: '♨', cursed: 1, name: 'BURN-IN',          desc: 'Charge ×2 · drain ×2.' },
  { id: 'gain',  g: '▦', cursed: 1, name: 'HOT GAIN STAGE',   desc: 'Joules ×1.5 · the snap zone shrinks 30%.' },
  { id: 'crt',   g: '◬', cursed: 1, name: 'CRACKED CRT',      desc: 'Joules ×1.6 · the beam jitters.' },
];

const SIGNAMES = ['FILAMENT WARMER', 'CLOCK TREE', 'PSU RAIL', 'COIL DRIVER', 'ANTENNA ARRAY',
  'MAGNETRON', 'ION PUMP', 'FLUX GATE', 'CRYO REGULATOR', 'BEAM STEERING', 'REACTOR PHASE', 'THE CARRIER'];
function signame(s) { return s <= SIGNAMES.length ? SIGNAMES[s - 1] : 'SECTOR ' + s; }

const MARKS = [
  { id: 'fix1',     name: 'First Fix' },
  { id: 'instant1', name: 'Reflex' },
  { id: 'combo10',  name: 'Ten Streak' },
  { id: 'combo25',  name: 'Untouchable' },
  { id: 'stage3',   name: 'Past the Rail' },
  { id: 'stage5',   name: 'Deep Plant' },
  { id: 'stage8',   name: 'Night Shift Legend' },
  { id: 'instant10',name: 'Lightning Hands' },
  { id: 'j1k',      name: 'Kilojoule Run' },
  { id: 'j10k',     name: 'Megawatt Heart' },
  { id: 'fuse1',    name: 'Saved by the Fuse' },
  { id: 'perfect',  name: 'Perfect Signal' },
  { id: 'comps5',   name: 'Tinkerer' },
  { id: 'codexall', name: 'Full Schematic' },
  { id: 'death5',   name: 'Five Blackouts' },
];

// ---------- seeded rng ----------
function mulberry(s) {
  s |= 0; s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return [(((t ^ (t >>> 14)) >>> 0) / 4294967296), s];
}
function rng(R) { const [v, s] = mulberry(R.rs); R.rs = s; return v; }

// ---------- meta (knowledge only) ----------
const META_KEY = 'phos-meta-v1', RUN_KEY = 'phos-run-v1';
function freshMeta() {
  return { v: 1, sound: true, runs: 0, deaths: 0, lifeJoules: 0, bestStage: 0, bestJoules: 0,
    bestCombo: 0, codex: {}, marks: {}, seenHow: false, last: null };
}
let M = freshMeta();
function loadMeta() {
  try {
    const raw = localStorage.getItem(META_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    const f = freshMeta();
    for (const k of Object.keys(f)) if (k in d) f[k] = d[k];
    M = f;
  } catch (e) {}
}
function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(M)); } catch (e) {} }

// ---------- formatting ----------
const SUFF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return n >= 100 || n % 1 === 0 ? String(Math.floor(n)) : n.toFixed(1);
  if (n < 1e6) return Math.floor(n).toLocaleString('en-US');
  const e = Math.floor(Math.log10(n));
  const t = Math.floor(e / 3);
  if (t < SUFF.length) {
    const m = n / Math.pow(10, t * 3);
    return (m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2)) + SUFF[t];
  }
  return (n / Math.pow(10, e)).toFixed(2) + 'e' + e;
}

// ============================================================
// PURE CORE — no DOM, no clocks, no unseeded randomness.
// One fault at a time is ACTIVE (oldest open); drag(R, d) moves
// that parameter; inside the snap zone it locks exactly and the
// fix is speed-rated against the beat.
// ============================================================

function newRun(seed) {
  const R = {
    v: 2, seed: seed >>> 0, rs: seed >>> 0,
    stage: 0, st: 0, beat: -1, bar: -1,
    tgt: { A: 0.5, F: 0.5, P: 0.5 },
    you: { A: 0.5, F: 0.5, P: 0.5 },
    open: [],                 // [{p, t0, warnBeat}] oldest first; one per param max
    sched: [],                // [{beat, p}] upcoming faults (warn at beat-1)
    slowT: 0,
    integ: 1, joules: 0, lockTime: 0, stageTime: 0,
    combo: 0, bestCombo: 0,
    comps: [], draft: null, over: null, fuseUsed: false,
    stats: { fixes: 0, instants: 0, quicks: 0, slows: 0, faults: 0, perfectStages: 0, drafts: 0, stageSlows: 0, stageInstants: 0 },
  };
  startStage(R, 1);
  return R;
}
function hasC(R, id) { return R.comps.indexOf(id) >= 0; }

function conf(R) {
  const s = R.stage;
  const bpm = Math.min(TUNE.bpmCap, TUNE.bpm0 + TUNE.bpmPer * (s - 1));
  const beatLen = 60 / bpm;
  let drain = (TUNE.drain0 + TUNE.drainPer * (s - 1)) * Math.pow(TUNE.drainLate, Math.max(0, s - TUNE.drainLateFrom));
  if (hasC(R, 'mem')) drain *= 0.75;
  if (hasC(R, 'burn')) drain *= 2;
  const szBase = Math.min(TUNE.faultSzCap, TUNE.faultSz0 + TUNE.faultSzPer * (s - 1)) * (hasC(R, 'oc') ? 1.5 : 1);
  return {
    bpm, beatLen, dur: TUNE.bars * TUNE.beatsPerBar * beatLen,
    knobs: s >= 3 ? ['A', 'F', 'P'] : s === 2 ? ['A', 'F'] : ['A'],
    snap: TUNE.snapZone * (hasC(R, 'wide') ? TUNE.wideMult : 1) * (hasC(R, 'gain') ? 0.7 : 1),
    drain, charge: TUNE.charge * (hasC(R, 'burn') ? 2 : 1),
    integCap: hasC(R, 'cap') ? 1.5 : 1,
    sz: {
      A: szBase * (hasC(R, 'atten') ? 0.5 : 1),
      F: szBase * (hasC(R, 'ocxo') ? 0.5 : 1),
      P: Math.min(TUNE.faultSzCap, szBase * (hasC(R, 'dline') ? 0.5 : 1)),
    },
    fpb: faultsPerBar(s),
    minGap: TUNE.minGapBeats + (hasC(R, 'notch') ? 1 : 0),
    fix: TUNE.fix0 * Math.pow(TUNE.jrGrow, s - 1)
      * (hasC(R, 'oc') ? 2 : 1) * (hasC(R, 'crt') ? 1.6 : 1) * (hasC(R, 'gain') ? 1.5 : 1),
    trickle: TUNE.trickle0 * Math.pow(TUNE.jrGrow, s - 1)
      * (hasC(R, 'oc') ? 2 : 1) * (hasC(R, 'crt') ? 1.6 : 1) * (hasC(R, 'gain') ? 1.5 : 1),

}

function startStage(R, s) {
  R.stage = s; R.st = 0; R.beat = -1; R.bar = -1;
  R.open = []; R.sched = []; R.slowT = 0;
  R.stats.stageSlows = 0; R.stats.stageInstants = 0;
  R.lockTime = 0; R.stageTime = 0;
  const c = conf(R);
  for (const p of ['A', 'F', 'P']) {
    R.tgt[p] = 0.25 + rng(R) * 0.5;
    R.you[p] = R.tgt[p];
  }
  R.integ = s === 1 ? c.integCap : Math.min(c.integCap, R.integ + TUNE.integRefill);
  // pre-schedule this stage's faults on the beat grid (seeded, gap-respecting)
  const totalBeats = TUNE.bars * TUNE.beatsPerBar;
  let lastBeat = -99;
  for (let bar = 0; bar < TUNE.bars; bar++) {
    let n = Math.floor(c.fpb) + (rng(R) < (c.fpb % 1) ? 1 : 0);
    if (s === 1 && bar === 0) n = Math.max(1, n); // guarantee an early teach-fault
    const beats = [];
    for (let i = 0; i < n; i++) beats.push(bar * TUNE.beatsPerBar + 1 + Math.floor(rng(R) * (TUNE.beatsPerBar - 1)));
    beats.sort((a, b) => a - b);
    for (const b of beats) {
      if (b - lastBeat < c.minGap || b >= totalBeats - 1) continue;
      const p = c.knobs[Math.floor(rng(R) * c.knobs.length)];
      const dir = rng(R) < 0.5 ? -1 : 1;
      R.sched.push({ beat: b, p, dir });
      lastBeat = b;
    }
  }
}

function wrapP(x) { x %= 1; return x < 0 ? x + 1 : x; }

function pdist(a, b) { let d = Math.abs(a - b) % 1; return d > 0.5 ? 1 - d : d; }

function activeFault(R) { return R.open.length ? R.open[0] : null; }

function landFault(R, c, f, ev) {
  // target jumps; if this param already has an open fault, the jump compounds it
  const sz = c.sz[f.p] * (0.8 + rng(R) * 0.4);
  if (f.p === 'P') R.tgt.P = wrapP(R.tgt.P + f.dir * sz);
  else {
    let v = R.tgt[f.p] + f.dir * sz;
    if (v > 0.97 || v < 0.03) v = R.tgt[f.p] - f.dir * sz; // bounce off rails
    R.tgt[f.p] = clamp01(v);
  }
  const already = R.open.find(o => o.p === f.p);
  if (!already) R.open.push({ p: f.p, t0: R.st });
  R.stats.faults++;
  if (hasC(R, 'hold')) R.slowT = TUNE.holdDur;
  ev.push({ t: 'fault', p: f.p, dir: f.dir });
}

function rateFix(R, c, age) {
  const beats = age / c.beatLen;
  if (beats <= TUNE.instantBeats) return 'instant';
  if (beats <= TUNE.quickBeats) return 'quick';
  if (beats <= TUNE.cleanBeats) return 'clean';
  return 'slow';
}

// drag the active fault's parameter by d (normalized); snap-assist closes it
function drag(R, d) {
  if (R.over || R.draft) return null;
  const f = activeFault(R);
  if (!f) return null;
  const c = conf(R);
  const p = f.p;
  if (p === 'P') R.you.P = wrapP(R.you.P + d);
  else R.you[p] = clamp01(R.you[p] + d);
  const snapZone = c.snap * (p === 'P' && hasC(R, 'pll') ? TUNE.pllZoneMult : 1);
  const e = p === 'P' ? pdist(R.you.P, R.tgt.P) : Math.abs(R.you[p] - R.tgt[p]);
  if (e <= snapZone) {
    R.you[p] = R.tgt[p];
    R.open.shift();
    const age = R.st - f.t0;
    const tier = rateFix(R, c, age);
    R.stats.fixes++;
    if (tier === 'instant') { R.stats.instants++; R.stats.stageInstants++; }
    if (tier === 'quick') R.stats.quicks++;
    if (tier === 'slow') { R.stats.slows++; R.stats.stageSlows++; }
    if (tier === 'instant' || tier === 'quick') {
      R.combo++; R.bestCombo = Math.max(R.bestCombo, R.combo);
    } else if (tier === 'slow') R.combo = 0;
    const mult = TUNE.spdMult[tier] * (1 + TUNE.comboPer * Math.min(TUNE.comboCap, R.combo));
    const j = c.fix * mult;
    R.joules += j;
    return { t: 'fix', p, tier, j, combo: R.combo, mult };
  }
  return null;
}

function step(R, dtReal) {
  const ev = [];
  if (R.over || R.draft) return ev;
  const c = conf(R);
  let dt = dtReal;
  if (R.slowT > 0) { R.slowT -= dtReal; dt = dtReal * TUNE.holdSlow; }
  R.st += dt; R.stageTime += dt;

  const beatIdx = Math.floor(R.st / c.beatLen);
  if (beatIdx !== R.beat) {
    R.beat = beatIdx;
    const inBar = beatIdx % TUNE.beatsPerBar;
    if (inBar === 0) { R.bar++; ev.push({ t: 'bar', n: R.bar }); }
    ev.push({ t: 'beat', n: beatIdx, inBar });
    // telegraphs + landings
    for (const f of R.sched) {
      if (f.beat - 1 === beatIdx && !f.warned) { f.warned = true; ev.push({ t: 'warn', p: f.p, dir: f.dir }); }
      if (f.beat === beatIdx && !f.landed) { f.landed = true; landFault(R, c, f, ev); }
    }
  }

  // servo: open faults shrink toward target
  if (hasC(R, 'servo')) {
    for (const o of R.open) {
      const p = o.p;
      let d = R.tgt[p] - R.you[p];
      if (p === 'P') d = ((d % 1) + 1.5) % 1 - 0.5;
      R.you[p] += d * Math.min(1, TUNE.servoRate * dt);
      if (p === 'P') R.you.P = wrapP(R.you.P);
    }
  }

  if (isLocked(R)) {
    R.lockTime += dt;
    R.joules += c.trickle * (1 + TUNE.comboPer * Math.min(TUNE.comboCap, R.combo)) * dt;
    R.integ = Math.min(c.integCap, R.integ + c.charge * dt);
  } else {
    R.integ -= c.drain * R.open.length * dt;
    if (R.integ <= 0) {
      if (hasC(R, 'fuse') && !R.fuseUsed) {
        R.fuseUsed = true; R.integ = TUNE.fuseRestore * c.integCap;
        ev.push({ t: 'fuse' });
      } else {
        R.integ = 0;
        R.over = { cause: 'blackout', stage: R.stage, joules: R.joules };
        ev.push({ t: 'blackout' });
        return ev;
      }
    }
  }

  if (R.st >= c.dur && R.open.length === 0) { // stage ends on a clean board
    const bonus = c.fix * 4 * R.integ;
    R.joules += bonus;
    const perfect = R.stats.stageSlows === 0;
    ev.push({ t: 'clear', stage: R.stage, bonus, perfect });
    R.draft = { offers: draftOffers(R) };
    ev.push({ t: 'draft', offers: R.draft.offers });
  }
  return ev;
}

function draftOffers(R) {
  const pool = COMPS.map(x => x.id).filter(id => !hasC(R, id));
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rng(R) * (i + 1));
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  return pool.slice(0, Math.min(3, pool.length));
}
function chooseComp(R, id) {
  if (!R.draft) return null;
  if (id && R.draft.offers.indexOf(id) < 0) return null;
  if (id) { R.comps.push(id); R.stats.drafts++; }
  if (id === 'cap') R.integ = 99; // "refilled now" — startStage clamps to the new cap
  R.draft = null;
  startStage(R, R.stage + 1);
  return { t: 'next', stage: R.stage };
}

const scopewrap = document.getElementById('scopewrap');
const scope = document.getElementById('scope');
const sctx = scope.getContext('2d');
const trigEl = document.getElementById('trig');
const signameEl = document.getElementById('signame');
const bpmtag = document.getElementById('bpmtag');
const jnum = document.getElementById('jnum');

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let R = null;

function resizeScope() {

  scope.width = scope.clientWidth * dpr; scope.height = scope.clientHeight * dpr;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resizeScope);

function shake(n) {

  const cls = 'shake' + n;
  scopewrap.classList.remove('shake1', 'shake2', 'shake3');
  void scopewrap.offsetWidth;
  scopewrap.classList.add(cls);
}

}

// ---------- pops ----------
let parts = [];
function pop(x, y, txt, kind, size) { // kind: ''|'gold'|'hot'
  if (parts.length > (reducedMotion ? 35 : 160)) parts.shift();
  parts.push({ x, y, vx: (Math.random() - 0.5) * 30, vy: -55 - Math.random() * 40, t: 0,
    life: kind === 'gold' ? 1.35 : 1.05, txt, kind: kind || '', size: size || (kind === 'gold' ? 18 : 13) });
}
function burst(cx, cy, n, txt, kind) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.5;
    parts.push({ x: cx, y: cy, vx: Math.cos(a) * (110 + Math.random() * 90), vy: Math.sin(a) * (110 + Math.random() * 90) - 30,
      t: 0, life: 1.0, txt, kind: kind || 'gold', size: 14 });
  }
}
const PCOL = { '': '#33ff99', gold: '#ffd75e', hot: '#ff5c5c' };
function drawParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt;
    const k = p.t / p.life;
    sctx.globalAlpha = k < 0.12 ? k / 0.12 : 1 - (k - 0.12) / 0.88;
    sctx.font = '700 ' + (p.size * (1 + k * 0.15)) + 'px ui-monospace, Menlo, Consolas, monospace';
    sctx.fillStyle = PCOL[p.kind] || PCOL[''];
    sctx.textAlign = 'center';
    sctx.fillText(p.txt, p.x, p.y);
  }
  sctx.globalAlpha = 1;
}

// ---------- scope rendering ----------
let scrollT = 0, beatFlash = 0;
function traceY(v, x01, mid, half) {
  const cyc = 1 + v.F * 5;
  return mid - (0.15 + 0.8 * v.A) * half * Math.sin(2 * Math.PI * (x01 * cyc + v.P) - scrollT * 2.2);
}
function drawScope(dt) {
  const W = scope.clientWidth, H = scope.clientHeight;
  scrollT += dt;
  sctx.globalAlpha = 1;
  sctx.fillStyle = 'rgba(2,5,3,0.34)';
  sctx.fillRect(0, 0, W, H);
  sctx.strokeStyle = 'rgba(51,255,153,0.07)';
  sctx.lineWidth = 1;
  sctx.beginPath();
  for (let i = 1; i < 10; i++) { const x = W * i / 10; sctx.moveTo(x, 0); sctx.lineTo(x, H); }
  for (let i = 1; i < 8; i++) { const y = H * i / 8; sctx.moveTo(0, y); sctx.lineTo(W, y); }
  sctx.stroke();
  sctx.strokeStyle = 'rgba(51,255,153,0.13)';
  sctx.beginPath();
  sctx.moveTo(W / 2, 0); sctx.lineTo(W / 2, H);
  sctx.moveTo(0, H / 2); sctx.lineTo(W, H / 2);
  sctx.stroke();
  if (!R) return;
  const mid = H * 0.52, half = H * 0.36;
  const jitter = hasC(R, 'crt') ? 1.6 : 0;
  const locked = isLocked(R);
  // reference (dashed amber; pulses red while a fault is open)
  sctx.setLineDash([6, 7]);
  sctx.strokeStyle = locked ? 'rgba(255,179,71,0.45)' : 'rgba(255,92,92,0.65)';
  sctx.lineWidth = 1.5;
  sctx.beginPath();
  for (let x = 0; x <= W; x += 4) {
    const y = traceY(R.tgt, x / W, mid, half);
    x === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
  }
  sctx.stroke();
  sctx.setLineDash([]);
  // your trace
  const glow = locked ? 1 : 0.7;
  for (const ps of [{ w: 8, a: 0.09 * glow }, { w: 3.4, a: 0.26 * glow }, { w: 1.7, a: 0.95 * glow }]) {
    sctx.strokeStyle = 'rgba(51,255,153,' + ps.a + ')';
    sctx.lineWidth = ps.w;
    sctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const y = traceY(R.you, x / W, mid, half) + (jitter ? (Math.random() - 0.5) * jitter * 2 : 0);
      x === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
    }
    sctx.stroke();
  }
  if (beatFlash > 0) {
    beatFlash -= dt * 6;
    sctx.globalAlpha = Math.max(0, beatFlash) * (locked ? 0.45 : 0.2);
    sctx.strokeStyle = locked ? '#33ff99' : '#ff5c5c';
    sctx.lineWidth = 2.5;
    sctx.strokeRect(3, 3, W - 6, H - 6);
    sctx.globalAlpha = 1;
  }
}

// ---------- sound ----------
let AC = null, youOsc = null, youGain = null, refOsc = null, refGain = null, audioOn = false;
function ac() {

    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
  return AC;
}
function tone(freq, dur, type, gainV, when) {
  const a = ac();
  if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + (when || 0);
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(gainV, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function startDrone() {
  if (audioOn || !M.sound) return;
  try {
    const a = ac(); if (!a) return;
    youOsc = a.createOscillator(); youGain = a.createGain();
    youOsc.type = 'triangle'; youGain.gain.value = 0;
    youOsc.connect(youGain); youGain.connect(a.destination);
    youOsc.start();
    refOsc = a.createOscillator(); refGain = a.createGain();
    refOsc.type = 'sine'; refGain.gain.value = 0;
    refOsc.connect(refGain); refGain.connect(a.destination);
    refOsc.start();
    audioOn = true;
  } catch (e) {}
}
function stopDrone() {
  try {
    if (youOsc) { youOsc.stop(); youOsc = null; }
    if (refOsc) { refOsc.stop(); refOsc = null; }
  } catch (e) {}
  audioOn = false;
}
function fHz(v) { return 110 * Math.pow(2, v * 1.585); }
function updateDrone() {
  if (!audioOn || !AC) return;
  try {
    const t = AC.currentTime;
    if (!R || R.over || R.draft || !overEl.hidden) {
      youGain.gain.setTargetAtTime(0, t, 0.1);
      refGain.gain.setTargetAtTime(0, t, 0.1);
      return;
    }
    youOsc.frequency.setTargetAtTime(fHz(R.you.F), t, 0.04);
    refOsc.frequency.setTargetAtTime(fHz(R.tgt.F), t, 0.04);
    youGain.gain.setTargetAtTime(0.02 * (0.4 + 0.6 * R.you.A), t, 0.08);
    refGain.gain.setTargetAtTime(isLocked(R) ? 0.002 : 0.012, t, 0.1);
  } catch (e) {}
}
const ARP = [523.25, 659.25, 783.99, 1046.5, 1318.5];
function sfx(kind, x) {
  if (!M.sound) return;
  try {
    if (kind === 'tick') tone(x ? 1320 : 880, 0.025, 'square', x ? 0.02 : 0.012);
    else if (kind === 'fix') { // arpeggio rises with combo
      const base = Math.min(4, Math.floor((x || 0) / 5));
      tone(ARP[base], 0.08, 'sine', 0.05);
      tone(ARP[Math.min(4, base + 1)], 0.1, 'sine', 0.04, 0.05);
    }
    else if (kind === 'instant') { tone(784, 0.07, 'sine', 0.055); tone(1046, 0.09, 'sine', 0.05, 0.04); tone(1568, 0.14, 'sine', 0.045, 0.09); }
    else if (kind === 'slow') tone(196, 0.2, 'sine', 0.035);
    else if (kind === 'streak') { tone(523, 0.09, 'triangle', 0.05); tone(659, 0.09, 'triangle', 0.05, 0.07); tone(784, 0.09, 'triangle', 0.05, 0.14); tone(1046, 0.22, 'sine', 0.05, 0.21); }
    else if (kind === 'warn') { tone(1200, 0.08, 'sawtooth', 0.028); tone(1500, 0.08, 'sawtooth', 0.028, 0.09); }
    else if (kind === 'fault') { tone(150, 0.16, 'sawtooth', 0.055); tone(95, 0.2, 'square', 0.04, 0.03); }
    else if (kind === 'trickle') tone(660 + (x || 0) * 30, 0.04, 'sine', 0.018);
    else if (kind === 'clear') { tone(440, 0.14, 'sine', 0.05); tone(554, 0.16, 'sine', 0.05, 0.1); tone(659, 0.2, 'sine', 0.05, 0.2); tone(880, 0.32, 'sine', 0.05, 0.3); }
    else if (kind === 'fuse') { tone(220, 0.3, 'square', 0.05); tone(330, 0.3, 'sine', 0.05, 0.12); }
    else if (kind === 'blackout') { tone(180, 1.2, 'sawtooth', 0.07); tone(60, 1.6, 'sine', 0.09, 0.2); }

}

// ---------- run lifecycle ----------
function startRun() {
  const seed = (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
  R = newRun(seed);
  M.runs++; saveMeta(); snapshot();
  overEl.hidden = true; draftEl.hidden = true;
  parts = []; lastJ = '';
  callout('SIG 01 — ' + signame(1), 'phos');
  if (!M.seenHow) toast('A FAULT IS COMING — DRAG ANYWHERE TO PULL THE WAVE BACK');
  startDrone();
  sfx('clear');
}
function commitRun() {
  if (!R) return;
  M.deaths++;
  M.lifeJoules += R.joules;
  if (R.joules > M.bestJoules) M.bestJoules = R.joules;
  if (R.stage > M.bestStage) M.bestStage = R.stage;
  M.bestCombo = Math.max(M.bestCombo, R.bestCombo);
  if (M.deaths >= 5) grantMark('death5');
  checkLiveMarks();
  M.last = { joules: R.joules, stage: R.stage, combo: R.bestCombo };
  saveMeta();
  try { localStorage.removeItem(RUN_KEY); } catch (e) {}
}
function snapshot() {
  if (!R || R.over) return;
  try { localStorage.setItem(RUN_KEY, JSON.stringify(R)); } catch (e) {}
}
function restoreRun() {
  try {
    const raw = localStorage.getItem(RUN_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || d.v !== 2 || d.over) return false;
    R = d;
    return true;
  } catch (e) { return false; }
}

// ---------- overlays ----------
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function showBench(lost) {
  let h = '';
  if (lost) {
    const L = M.last;
    h += '<h1 class="lost">S I G N A L   L O S T</h1>' +
      '<p>blackout at SIG ' + String(L.stage).padStart(2, '0') + ' — ' + esc(signame(L.stage)) + '</p>' +
      '<div class="jsum">' + fmt(Math.floor(L.joules)) + ' J</div>' +
      '<p>' + (L.joules >= M.bestJoules ? 'a new record ⚡<br>' : '') +
      'best ' + fmt(Math.floor(M.bestJoules)) + ' J · deepest SIG ' + String(M.bestStage).padStart(2, '0') +
      ' · streak ' + L.combo + ' · lifetime ' + fmt(Math.floor(M.lifeJoules)) + ' J</p>';
  } else {
    h += '<h1>P H O S P H O R</h1>' +
      '<p>night shift at the installation. the reference wave takes a hit —<br>' +
      '<b style="color:var(--fg)">drag anywhere</b> to haul your trace back on top of it. ' +
      'close enough and it <b style="color:var(--fg)">SNAPS</b> into lock.<br><br>' +
      'fast fixes pay big: <b style="color:var(--gold)">INSTANT ×4</b> · QUICK ×2 · CLEAN ×1.<br>' +
      'streaks multiply on top. faults are telegraphed one beat ahead — listen.<br>' +
      'open faults drain integrity (top edge). zero = blackout. it accelerates forever.</p>';
  }
  h += '<button id="poweron">' + (lost ? 'P O W E R   O N' : 'C L O C K   I N') + '</button>';
  overEl.innerHTML = h;
  overEl.hidden = false;
  document.getElementById('poweron').addEventListener('click', () => { ac(); startRun(); });
}
function showDraft(offers) {
  let h = '<h2>S P A R E S   C R A T E</h2><div class="sub2">SIG ' + String(R.stage).padStart(2, '0') +
    ' CLEARED — TAKE ONE COMPONENT</div><div class="cards">';
  for (const id of offers) {
    const cdef = COMPS.find(x => x.id === id);
    const known = !!M.codex[id];
    M.codex[id] = true;
    h += '<button class="card' + (cdef.cursed ? ' cursed' : '') + '" data-id="' + id + '">' +
      '<span class="g">' + cdef.g + '</span>' +
      '<span class="n">' + esc(cdef.name) + '</span>' +
      '<span class="d">' + (known ? esc(cdef.desc) : '— unmarked part · install it to learn it —') + '</span>' +
      '</button>';
  }
  h += '</div><button id="skipdraft">L E A V E   I T</button>';
  draftEl.innerHTML = h;
  draftEl.hidden = false;
  saveMeta();
  sfx('draftbell');
  const next = () => {
    draftEl.hidden = true;
    callout('SIG ' + String(R.stage).padStart(2, '0') + ' — ' + signame(R.stage), 'phos');
    bpmPopped = false;
    snapshot(); checkLiveMarks(); renderChrome(true);
  };
  draftEl.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id;
    chooseComp(R, id);
    const cdef = COMPS.find(x => x.id === id);
    toast(cdef.g + ' ' + cdef.name + ' INSTALLED', cdef.cursed ? 'hot' : undefined);
    next();
  }));
  document.getElementById('skipdraft').addEventListener('click', () => { chooseComp(R, null); next(); });
}
let bpmPopped = false;

// ---------- event application ----------
const PNAME = { A: 'AMPLITUDE', F: 'FREQUENCY', P: 'PHASE' };
function applyEvents(ev) {
  for (const e of ev) {
    if (e.t === 'beat') { sfx('tick', e.inBar === 0); beatFlash = 1; if (isLocked(R) && e.inBar === 0 && R.stageTime > 0.5) { const c = conf(R); const j = c.trickle * conf(R).beatLen * 4; pop(scope.clientWidth / 2 + (Math.random() - 0.5) * 90, scope.clientHeight * 0.22, '+' + fmt(Math.max(1, Math.floor(j))), '', 12); sfx('trickle', R.combo); } }
    else if (e.t === 'warn') {
      sfx('warn');
      callout('⚠ ' + PNAME[e.p], 'hot');
    }
    else if (e.t === 'fault') {
      sfx('fault');
      shake(1);
    }
    else if (e.t === 'fix') {
      const cx = scope.clientWidth / 2, cy = scope.clientHeight * 0.45;
      if (e.tier === 'instant') {
        callout('INSTANT ×' + e.mult.toFixed(1), '');
        shake(3);
        burst(cx, cy, 14, '+', 'gold');
        sfx('instant');
      } else if (e.tier === 'quick') {
        callout('QUICK ×' + e.mult.toFixed(1), '');
        shake(2);
        burst(cx, cy, 7, '+', 'gold');
        sfx('fix', e.combo);
      } else if (e.tier === 'clean') {
        shake(1);
        sfx('fix', e.combo);
      } else {
        callout('SLOW', 'hot');
        sfx('slow');
      }
      pop(cx + (Math.random() - 0.5) * 100, cy - 30, '+' + fmt(Math.floor(e.j)) + ' J', e.tier === 'slow' ? 'hot' : 'gold', e.tier === 'instant' ? 24 : 18);
      jnum.classList.remove('bump'); void jnum.offsetWidth; jnum.classList.add('bump');
      if (e.combo > 0 && e.combo % 5 === 0) {
        callout('STREAK ' + e.combo, '');
        burst(cx, cy - 60, 10, '✦', 'gold');
        sfx('streak');
      }
      checkLiveMarks();
    }
    else if (e.t === 'fuse') { toast('⏚ SURGE PROTECTOR BLOWS — 30% RESTORED', 'hot'); sfx('fuse'); shake(2); grantMark('fuse1'); }
    else if (e.t === 'clear') {
      pop(scope.clientWidth / 2, scope.clientHeight * 0.4, '+' + fmt(Math.floor(e.bonus)) + ' J BONUS', 'gold', 20);
      callout('SIG ' + String(e.stage).padStart(2, '0') + ' CLEARED', 'phos');
      sfx('clear');
      shake(2);
      if (e.perfect && e.stage >= 2) grantMark('perfect');
    }
    else if (e.t === 'draft') showDraft(e.offers);
    else if (e.t === 'blackout') {
      commitRun();
      stopDrone();
      sfx('blackout');
      shake(3);
      setTimeout(() => showBench(true), 1100);
    }
  }
}

// ---------- chrome ----------
let lastJ = '';
function renderChrome(force) {
  if (!R) return;
  const c = conf(R);
  const jtxt = fmt(Math.floor(R.joules));
  if (jtxt !== lastJ || force) { jnum.textContent = jtxt; lastJ = jtxt; }
  const cm = 1 + TUNE.comboPer * Math.min(TUNE.comboCap, R.combo);
  comboEl.textContent = R.combo > 0 ? '×' + cm.toFixed(2) + ' STREAK ' + R.combo : '';
  comboEl.style.opacity = R.combo > 0 ? 1 : 0;
  const locked = isLocked(R);
  trigEl.textContent = locked ? "TRIG'D" : R.open.length > 1 ? 'FAULT ×' + R.open.length : 'FAULT';
  trigEl.className = locked ? 'lock' : 'lost';
  signameEl.textContent = 'SIG ' + String(R.stage).padStart(2, '0') + ' · ' + signame(R.stage);
  bpmtag.textContent = c.bpm + ' BPM · BAR ' + Math.min(TUNE.bars, R.bar + 1) + '/' + TUNE.bars;
  integfill.style.width = (R.integ / c.integCap * 100) + '%';
  integEl.classList.toggle('low', R.integ < 0.25 * c.integCap);
  // direction arrow for the active fault
  const f = activeFault(R);
  if (f && !R.over) {
    const p = f.p;
    let d = R.tgt[p] - R.you[p];
    if (p === 'P') d = ((d % 1) + 1.5) % 1 - 0.5;
    const up = p === 'A';
    arrowEl.textContent = up ? (d > 0 ? '▲▲' : '▼▼') : (d > 0 ? '▶▶' : '◀◀');
    arrowEl.style.opacity = 0.9;
    arrowlbl.textContent = PNAME[p];
    arrowlbl.style.opacity = 0.9;
  } else { arrowEl.style.opacity = 0; arrowlbl.style.opacity = 0; }
  // meters
  for (const p of ['A', 'F', 'P']) {
    const m = document.getElementById('m-' + p);
    const on = c.knobs.indexOf(p) >= 0;
    m.classList.toggle('off', !on);
    m.classList.toggle('fault', on && R.open.some(o => o.p === p));
    const W = m.clientWidth, pad = 10;
    m.querySelector('.tick').style.left = (pad + R.you[p] * (W - 2 * pad)) + 'px';
    m.querySelector('.tgt').style.left = (pad + R.tgt[p] * (W - 2 * pad)) + 'px';
  }
}

// ---------- input: the whole scope is the knob ----------
let dragId = null, lastX = 0, lastY = 0;
function inputStart(x, y, id) {
  if (dragId !== null) return;
  dragId = id; lastX = x; lastY = y;
  ac(); startDrone();
  if (!M.seenHow) { M.seenHow = true; saveMeta(); }
}
function inputMove(id, x, y) {
  if (dragId !== id || !R) return;
  const f = activeFault(R);
  if (f) {
    const W = Math.max(200, scope.clientWidth), H = Math.max(200, scope.clientHeight);
    const d = f.p === 'A' ? -(y - lastY) / (H * 0.5) : (x - lastX) / (W * 0.55);
    const r = drag(R, d);
    if (r) applyEvents([r]);
  }
  lastX = x; lastY = y;
}
function inputEnd(id) { if (dragId === id) dragId = null; }
scopewrap.addEventListener('pointerdown', e => {
  if (e.target.closest('#dock') || e.target.closest('#panel')) return;
  scopewrap.setPointerCapture && scopewrap.setPointerCapture(e.pointerId);
  inputStart(e.clientX, e.clientY, e.pointerId);
});
scopewrap.addEventListener('pointermove', e => inputMove(e.pointerId, e.clientX, e.clientY));
scopewrap.addEventListener('pointerup', e => inputEnd(e.pointerId));
scopewrap.addEventListener('pointercancel', e => inputEnd(e.pointerId));
if (!window.PointerEvent) {
  scopewrap.addEventListener('touchstart', e => {
    if (e.target.closest('#dock') || e.target.closest('#panel')) return;
    const t = e.changedTouches[0];
    inputStart(t.clientX, t.clientY, 'T' + t.identifier);
  }, { passive: true });
  scopewrap.addEventListener('touchmove', e => {
    const t = e.changedTouches[0];
    inputMove('T' + t.identifier, t.clientX, t.clientY);
  }, { passive: true });
  scopewrap.addEventListener('touchend', e => { inputEnd('T' + e.changedTouches[0].identifier); }, { passive: true });
}
scopewrap.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePanel(); return; }
  if (!R || R.over) return;
  if (R.draft && !draftEl.hidden) {
    const i = parseInt(e.key, 10) - 1;
    const cards = draftEl.querySelectorAll('.card');
    if (i >= 0 && i < cards.length) cards[i].click();
    return;
  }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) >= 0) {
    e.preventDefault();
    ac(); startDrone();
    const dir = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? 1 : -1;
    const r = drag(R, dir * (e.shiftKey ? 0.01 : 0.035));
    if (r) applyEvents([r]);
  }
});

// ---------- panels ----------
let openTab = null;
function openPanel(tab) {
  openTab = tab;
  panel.classList.add('open');
  document.querySelectorAll('.dockbtn').forEach(b => b.classList.toggle('open', b.dataset.tab === tab));
  renderPanel();
}
function closePanel() {
  openTab = null;
  panel.classList.remove('open');
  document.querySelectorAll('.dockbtn').forEach(b => b.classList.remove('open'));
}
document.getElementById('pclose').addEventListener('click', closePanel);
document.querySelectorAll('.dockbtn').forEach(b =>
  b.addEventListener('click', e => {
    e.stopPropagation();
    openTab === b.dataset.tab ? closePanel() : openPanel(b.dataset.tab);
  }));
function renderPanel() {
  if (!openTab) return;
  if (openTab === 'rec') {
    ptitle.textContent = 'R E C O R D S';
    let h = '';
    if (R && !R.over) {
      h += '<h4>THIS SHIFT</h4>' +
        '<div class="stat"><span>joules</span><b>' + fmt(Math.floor(R.joules)) + ' J</b></div>' +
        '<div class="stat"><span>signal</span><b>SIG ' + String(R.stage).padStart(2, '0') + '</b></div>' +
        '<div class="stat"><span>fixes (instant)</span><b>' + R.stats.fixes + ' (' + R.stats.instants + ')</b></div>' +
        '<div class="stat"><span>best streak</span><b>' + R.bestCombo + '</b></div>' +
        '<div class="stat"><span>components</span><b>' + R.comps.length + '</b></div>';
    }
    h += '<h4>BESTS</h4>' +
      '<div class="stat"><span>joules (one shift)</span><b>' + fmt(Math.floor(M.bestJoules)) + ' J</b></div>' +
      '<div class="stat"><span>deepest signal</span><b>SIG ' + String(M.bestStage).padStart(2, '0') + '</b></div>' +
      '<div class="stat"><span>best streak</span><b>' + M.bestCombo + '</b></div>' +
      '<h4>LIFETIME</h4>' +
      '<div class="stat"><span>joules</span><b>' + fmt(Math.floor(M.lifeJoules)) + ' J</b></div>' +
      '<div class="stat"><span>shifts</span><b>' + M.runs + '</b></div>' +
      '<div class="stat"><span>blackouts</span><b>' + M.deaths + '</b></div>' +
      '<h4>MARKS · ' + Object.keys(M.marks).length + '/' + MARKS.length + '</h4><div class="achgrid">' +
      MARKS.map(mk => '<span class="ach' + (M.marks[mk.id] ? ' got' : '') + '">' + esc(mk.name) + '</span>').join('') + '</div>';
    pbody.innerHTML = h;
  } else if (openTab === 'codex') {
    ptitle.textContent = 'S C H E M A T I C';
    pbody.innerHTML = '<p class="note">One component offered after every cleared signal. A part must be offered once before its label is legible.</p>' +
      COMPS.map(cdef => {
        const known = !!M.codex[cdef.id];
        const held = R && !R.over && hasC(R, cdef.id);
        return '<div class="row ' + (known ? 'codexed' : 'unknown') + (cdef.cursed ? ' cursedr' : '') + '">' +
          '<div class="l"><div class="name">' + cdef.g + '  ' + (known ? esc(cdef.name) : '— ? —') + (held ? ' · installed' : '') + '</div>' +
          '<div class="sub">' + (known ? esc(cdef.desc) : 'not yet encountered') + '</div></div></div>';
      }).join('');
  } else if (openTab === 'log') {
    ptitle.textContent = 'M A N U A L';
    pbody.innerHTML =
      '<p class="note">Faults knock the reference wave — amplitude, frequency or phase — one at a time, telegraphed one beat ahead. ' +
      'DRAG ANYWHERE (the whole scope is the knob; arrows show the way) to haul your trace back. Near the mark it SNAPS into lock.</p>' +
      '<p class="note">Fix speed pays: INSTANT (within a beat) ×4 · QUICK ×2 · CLEAN ×1 · SLOW ×0.4 and your streak breaks. ' +
      'Streak multiplies everything (up to ×4). Open faults drain integrity; clean signal recharges it and trickles joules. ' +
      'Each cleared signal offers a component and turns the plant up: faster BPM, bigger faults, more of them, harder drain. Blackout is inevitable — the score is how loud you go.</p>' +
      '<p class="note">Keyboard: arrows fix (shift = fine) · 1/2/3 picks drafts · Esc closes. Nothing persists but knowledge.</p>' +
      (M.last ? '<h4>LAST SHIFT</h4><div class="stat"><span>SIG ' + String(M.last.stage).padStart(2, '0') + '</span><b>' +
        fmt(Math.floor(M.last.joules)) + ' J</b></div>' : '') +
      '<h4>SETTINGS</h4>' +
      '<button class="bigbtn" data-act="sound">SOUND ' + (M.sound ? 'ON' : 'OFF') + '</button>' +
      (R && !R.over ? '<button class="bigbtn danger" data-act="abandon">ABANDON SHIFT (counts as a blackout)</button>' : '') +
      '<button class="bigbtn danger" data-act="wipe">DEGAUSS (forget everything)</button>';
  }
}
pbody.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'sound') {
    M.sound = !M.sound; saveMeta(); renderPanel();
    if (!M.sound) stopDrone(); else if (R && !R.over) startDrone();
  } else if (act === 'abandon') {
    if (R && !R.over) { R.over = { cause: 'abandon', stage: R.stage, joules: R.joules }; commitRun(); stopDrone(); closePanel(); showBench(true); }
  } else if (act === 'wipe') {
    if (confirm('Forget every mark, record and schematic entry?')) {
      try { localStorage.removeItem(META_KEY); localStorage.removeItem(RUN_KEY); } catch (err) {}
      location.reload();
    }
  }
});
let panelHold = false, panelHoldUntil = 0;
panel.addEventListener('pointerdown', () => { panelHold = true; });
panel.addEventListener('pointerup', () => { panelHold = false; panelHoldUntil = performance.now() + 350; });
panel.addEventListener('pointercancel', () => { panelHold = false; panelHoldUntil = performance.now() + 350; });

// ---------- boot & loop ----------
loadMeta();
resizeScope();
const resumed = restoreRun();
if (resumed) {
  toast('THE SHIFT RESUMES');
  callout('SIG ' + String(R.stage).padStart(2, '0') + ' — ' + signame(R.stage), 'phos');
  if (R.draft) showDraft(R.draft.offers);
} else showBench(false);

let lastFrame = performance.now(), acc = 0, panelTimer = 0, resumeGrace = 0, snapTimer = 0;
const STEP = 0.02;
function frame(now) {
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  dt = Math.min(dt, 0.25); // stalls pause the shift
  if (resumeGrace > 0) { resumeGrace -= dt; dt = 0; }
  if (R && !R.over && !R.draft && overEl.hidden) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 25) { applyEvents(step(R, STEP)); acc -= STEP; n++; if (!R || R.over || R.draft) { acc = 0; break; } }
  }
  drawScope(dt);
  drawParts(dt);
  if (R) renderChrome();
  updateDrone();
  panelTimer += dt;
  if (panelTimer > 0.3) {
    panelTimer = 0;
    if (openTab && !panelHold && now > panelHoldUntil) renderPanel();
  }
  snapTimer += dt;
  if (snapTimer > 5) { snapTimer = 0; saveMeta(); snapshot(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('pagehide', () => { saveMeta(); snapshot(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { saveMeta(); snapshot(); stopDrone(); }
  else { lastFrame = performance.now(); acc = 0; resumeGrace = 0.8; if (R && !R.over && M.sound) startDrone(); }
});
</script>
</body>
